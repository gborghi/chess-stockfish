function syncAnimWeather() {
  if (!showAnimazioni) {
    if (animWeatherKey || document.querySelector('#myBoard .anim-weather')) {
      $('#myBoard .anim-weather').remove();
      animWeatherKey = '';
    }
    return;
  }
  if (!$('#myBoard .square-55d63').length) return;
  var fen = viewChess().fen();
  var present = $('#myBoard .anim-weather').length;
  if (animWeatherKey.indexOf(fen + '|') === 0) {
    var listed = animWeatherKey.slice(fen.length + 1);
    var expected = listed ? listed.split(',').length : 0;
    if (present === expected) return;
  }
  var squares = endangeredSquares();
  animWeatherKey = fen + '|' + squares.join(',');
  var want = {};
  squares.forEach(function(sq) { want[sq] = true; });
  $('#myBoard .square-55d63').each(function() {
    var match = (this.className || '').match(/square-([a-h][1-8])/);
    if (!match) return;
    var sq = match[1];
    var has = this.querySelector('.anim-weather');
    if (want[sq]) {
      if (!has) this.appendChild(weatherNode());
      else this.appendChild(has);
    } else if (has && has.parentNode) {
      has.parentNode.removeChild(has);
    }
  });
}

function replaceFenSquare(fenBoard, square, newPiece) {
  var boardArray = fenBoard.split('/');
  var rowIndex = 8 - parseInt(square[1]);
  var colIndex = square.charCodeAt(0) - 97;
  var cells = [];
  var rowStr = boardArray[rowIndex];
  for (var i = 0; i < rowStr.length; i++) {
    if (/\d/.test(rowStr[i])) {
      for (var k = 0; k < parseInt(rowStr[i]); k++) cells.push('.');
    } else {
      cells.push(rowStr[i]);
    }
  }
  cells[colIndex] = newPiece !== null ? newPiece : '.';
  var newRow = '', count = 0;
  for (var j = 0; j < cells.length; j++) {
    if (cells[j] === '.') { count++; }
    else { if (count > 0) { newRow += count; count = 0; } newRow += cells[j]; }
  }
  if (count > 0) newRow += count;
  boardArray[rowIndex] = newRow;
  return boardArray.join('/');
}

function viewChess() {
  if (fenHistory && fenHistory[viewIndex]) {
    try { return new Chess(fenHistory[viewIndex]); } catch (e) {}
  }
  return game;
}

function allSquares() {
  var squares = [];
  for (var file = 0; file < 8; file++) {
    for (var rank = 1; rank <= 8; rank++) {
      squares.push(String.fromCharCode(97 + file) + rank);
    }
  }
  return squares;
}

function fenToCells(fenBoard) {
  var rows = fenBoard.split('/');
  var cells = [];
  for (var r = 0; r < 8; r++) {
    var row = [];
    var s = rows[r] || '';
    for (var i = 0; i < s.length; i++) {
      if (/\d/.test(s[i])) {
        for (var k = 0; k < parseInt(s[i], 10); k++) row.push('.');
      } else {
        row.push(s[i]);
      }
    }
    while (row.length < 8) row.push('.');
    cells.push(row);
  }
  return cells;
}

function cellsToFen(cells) {
  var parts = [];
  for (var r = 0; r < cells.length; r++) {
    var out = '';
    var n = 0;
    for (var c = 0; c < cells[r].length; c++) {
      if (cells[r][c] === '.') n++;
      else {
        if (n) { out += n; n = 0; }
        out += cells[r][c];
      }
    }
    if (n) out += n;
    parts.push(out);
  }
  return parts.join('/');
}

function getAttackers(targetSquare, attackerColor, isFriendly, pseudoLegal) {
  var fenParts = viewChess().fen().split(' ');
  fenParts[1] = attackerColor;
  fenParts[3] = '-';
  if (isFriendly) {
    var occ = viewChess().get(targetSquare);
    if (occ && occ.type === 'k' && occ.color === attackerColor) {
      var cells = fenToCells(fenParts[0]);
      var tr = 8 - parseInt(targetSquare[1], 10);
      var tc = targetSquare.charCodeAt(0) - 97;
      var kingChar = cells[tr] && cells[tr][tc];
      var dest = null;
      if (kingChar && kingChar !== '.') {
        for (var r = 0; r < 8 && !dest; r++) {
          for (var c = 0; c < 8; c++) {
            if (cells[r][c] !== '.') continue;
            if (r === tr || c === tc || Math.abs(r - tr) === Math.abs(c - tc)) continue;
            dest = { r: r, c: c };
            break;
          }
        }
        if (dest) {
          cells[tr][tc] = '.';
          cells[dest.r][dest.c] = kingChar;
          fenParts[0] = cellsToFen(cells);
        }
      }
    }
    var dummyPiece = attackerColor === 'w' ? 'p' : 'P';
    fenParts[0] = replaceFenSquare(fenParts[0], targetSquare, dummyPiece);
  }
  var attackers = [];
  var seen = {};
  try {
    var tempGame = new Chess(fenParts.join(' '));
    var opts = { verbose: true };
    if (pseudoLegal) opts.legal = false;
    tempGame.moves(opts).forEach(function(m) {
      if (m.to === targetSquare && !seen[m.from]) {
        seen[m.from] = true;
        attackers.push(m.from);
      }
    });
  } catch (e) { console.warn('getAttackers error:', e); }
  return attackers;
}

function updateAdvantageBar(score) {
  currentScore = score;
  if (game.game_over() || game.in_draw()) {
    paintBars(50);
    setEvalLabels('0', 'Patta');
    return;
  }
  var winProb = 1 / (1 + Math.exp(-0.0035 * score));
  paintBars(winProb * 100);
  setEvalLabels(
    formatEvalLabel(score, null),
    score + ' cp (' + Math.round(winProb * 100) + '% ♔)'
  );
}

function updateGameResult() {
  if (abandonedBy) {
    $('#gameResult, #gameResultRight').text(abandonText())
      .removeClass().addClass('text-danger fw-bold');
  } else if (game.in_checkmate()) {
    var winner = game.turn() === 'w' ? 'Nero' : 'Bianco';
    $('#gameResult, #gameResultRight').text('Scaccomatto! ' + winner + ' vince')
      .removeClass().addClass('text-danger fw-bold');
  } else if (game.in_draw()) {
    $('#gameResult, #gameResultRight').text('Patta')
      .removeClass().addClass('text-muted fw-bold');
    updateAdvantageBar(0);
  } else {
    $('#gameResult, #gameResultRight').text('');
  }
  refreshReviewButton();
}

// ── MOVE HISTORY ──

function recordMove(san) {
  var after = game.fen();
  var before = after;
  var undone = game.undo();
  if (undone) {
    before = game.fen();
    var restored = game.move({
      from: undone.from,
      to: undone.to,
      promotion: undone.promotion
    });
    if (!restored) game.load(after);
  }
  var fromView = fenHistory[viewIndex] === before;
  if (viewIndex < moveHistory.length) {
    if (!fromView) {
      if (before === fenHistory[moveHistory.length]) {
        moveHistory.push(san);
        fenHistory.push(after);
        moveMarks.push('');
        glyphMarks.push('');
        updateMoveList();
      }
      return;
    }
    moveHistory = moveHistory.slice(0, viewIndex);
    fenHistory = fenHistory.slice(0, viewIndex + 1);
    moveMarks = moveMarks.slice(0, viewIndex);
    glyphMarks = glyphMarks.slice(0, viewIndex);
  }
  moveHistory.push(san);
  fenHistory.push(after);
  moveMarks.push('');
  glyphMarks.push('');
  viewIndex = moveHistory.length;
  isReplaying = false;
  updateMoveList();
}

function updateMoveList() {
  var html = '';
  for (var i = 0; i < moveHistory.length; i++) {
    var moveNum = Math.floor(i / 2) + 1;
    var isWhite = (i % 2 === 0);
    if (isWhite) html += '<span class="move-num">' + moveNum + '.</span> ';
    var activeClass = (i + 1 === viewIndex) ? ' move-active' : '';
    var mark = '';
    if (moveMarks[i] === 'inaccuracy' || moveMarks[i] === 'mistake' || moveMarks[i] === 'blunder') {
      mark = ' move-' + moveMarks[i];
    }
    html += '<span class="move-san' + activeClass + mark + '" data-idx="' + (i + 1) + '">' + moveHistory[i] + '</span> ';
  }
  $('#moveList').html(html);
  $('#moveCounter').text(viewIndex + ' / ' + moveHistory.length);
  paintGlyphs();
  paintArchivio();
  paintApertura();
  paintChiVince();
  paintScacco();
  var el = document.getElementById('moveList');
  if (el) el.scrollTop = el.scrollHeight;
}

function goToMove(idx) {
  if (idx < 0) idx = 0;
  if (idx > moveHistory.length) idx = moveHistory.length;
  viewIndex = idx;
  isReplaying = (idx < moveHistory.length);
  if (isReplaying) {
    cancelSearch();
    clearHint(true);
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
  }

  // replay-umano-taglia-linea: il FEN visto entra in game, ma non si esce dal
  // replay. Indietro sul turno umano: drag e tap tagliano la linea (recordMove).
  // Indietro sul turno del computer, in pausa, in abbandono o con entrambi i
  // colori al computer: il motore non parte.
  var fen = fenHistory[idx];
  selectedSquare = null;
  lastMoveMark = null;
  hidePromotionPicker();
  board.position(fen);
  if (fen) {
    try { game.load(fen); } catch (e) {}
  }
  removeAllHighlights();
  updateMoveList();
}

function initStockfish() {
  updateStatus('Caricamento Stockfish...', 'info');
  var stockfishUrl = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
  fetch(stockfishUrl)
    .then(function(r) {
      if (!r.ok) throw new Error('Fetch fallito: ' + r.status);
      return r.text();
    })
    .then(function(script) {
      var blob = new Blob([script], {type: 'application/javascript'});
      var url = URL.createObjectURL(blob);
      stockfish = new Worker(url);
      stockfish.onmessage = function(e) {
        onStockfishLine(String(e.data || '').trim());
      };
      stockfish.onerror = function(err) { console.error('Worker error:', err); };
      stockfish.postMessage('uci');
      stockfish.postMessage('isready');
      try {
        hintStockfish = new Worker(url);
        hintStockfish.onmessage = function(e) {
          onHintStockfishLine(String(e.data || '').trim());
        };
        hintStockfish.onerror = function(err) { console.error('Hint worker error:', err); };
        hintStockfish.postMessage('uci');
        hintStockfish.postMessage('isready');
      } catch (hintErr) {
        hintStockfish = null;
        hintStockfishReady = false;
        console.error('Hint Stockfish non avviato:', hintErr);
      }
    })
    .catch(function(err) { updateStatus('Errore caricamento Stockfish', 'danger'); });
}

function onDragStart(source, piece) {
  if (isSetupMode || promotionPending) return false;
  if (matchOver()) return false;
  var turn = game.turn();
  if ((turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack)) return false;
  if (computerPlaysWhite && computerPlaysBlack) return false;
  if ((turn === 'w' && piece.search(/^b/) !== -1) || (turn === 'b' && piece.search(/^w/) !== -1)) return false;
  return true;
}

function onDrop(source, target) {
  if (abandonedBy || isSetupMode || promotionPending) return 'snapback';
  if (needsPromotion(source, target)) {
    if (!promotionLegal(source, target)) return 'snapback';
    showPromotionPicker(source, target);
    return 'snapback';
  }
  var move = game.move({from: source, to: target});
  if (move === null) return 'snapback';
  finishHumanMove(move);
}

function onSquareTap(square) {
  if (abandonedBy || promotionPending) return;
  var piece = game.get(square);
  var turn = game.turn();
  if (selectedSquare) {
    if (selectedSquare === square) {
      selectedSquare = null;
      removeAllHighlights();
      return;
    }
    if (humanCanMove() && needsPromotion(selectedSquare, square) && promotionLegal(selectedSquare, square)) {
      showPromotionPicker(selectedSquare, square);
      return;
    }
    if (humanCanMove()) {
      var move = game.move({from: selectedSquare, to: square});
      if (move !== null) {
        finishHumanMove(move);
        return;
      }
    }
    if (piece && ((piece.color === turn && humanCanMove()) || showLegal || showControlled)) {
      selectedSquare = square;
      highlightSelectedAndMoves(square);
      return;
    }
    selectedSquare = null;
    removeAllHighlights();
    return;
  }
  if (piece && piece.color === turn && humanCanMove()) {
    selectedSquare = square;
    highlightSelectedAndMoves(square);
    return;
  }
  if (piece && (showLegal || showControlled)) {
    selectedSquare = square;
    highlightSelectedAndMoves(square);
  }
}

function highlightSelectedAndMoves(square) {
  selectedSquare = square;
  removeAllHighlights();
}

function makeComputerMove() {
  if (isSetupMode || isPaused || isReplaying || matchOver()) return;
  var turn = game.turn();
  if (!((turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack))) return;
  if (!stockfishReady) {
    timeoutId = setTimeout(makeComputerMove, 1200);
    return;
  }
  clearHint(true);
  var depth, skill;
  if ((turn === 'w' && computerPlaysWhite) || (turn === 'b' && !computerPlaysWhite)) {
    depth = strengthLevel;
    skill = skillLevel;
  } else {
    depth = strengthLevelBlack;
    skill = skillLevelBlack;
  }
  if (depth == 0) {
    cancelSearch();
    var moves = game.moves({verbose: true});
    if (!moves.length) return;
    var randomMove = moves[Math.floor(Math.random() * moves.length)];
    var played = game.move(randomMove);
    if (!played) return;
    finishComputerMove(played, 'Mossa random (depth 0)', 'warning', 400);
    return;
  }
  updateStatus('Stockfish sta pensando...', 'warning');
  queueSearch({kind: 'game', depth: depth, skill: skill, fen: game.fen()});
}

function loadGameById(id) {
  updateStatus('Caricamento partita...', 'warning');
  google.script.run
    .withSuccessHandler(function(g) {
      if (!g) {
        updateStatus('Partita non trovata.', 'danger');
        return;
      }
      var pgn = g.pgn ? String(g.pgn) : '';
      var fen0 = (g.startFen && g.startFen !== 'startpos') ? String(g.startFen) : '';
      var trial = new Chess();
      if (pgn.trim()) {
        if (!trial.load_pgn(pgn)) {
          updateStatus('PGN non valido. Scacchiera non aggiornata.', 'danger');
          return;
        }
      } else if (fen0) {
        if (!trial.load(fen0)) {
          updateStatus('FEN iniziale non valido. Scacchiera non aggiornata.', 'danger');
          return;
        }
      }
      cancelSearch();
      hidePromotionPicker();
      clearHint(true);
      abortAnalysis(false);
      if (isSetupMode) {
        isSetupMode = false;
        $('#setupContainer').addClass('d-none');
        $('#myBoard').removeClass('d-none');
        if (setupBoard) { setupBoard.destroy(); setupBoard = null; }
      }
      game = trial;
      startFen = g.startFen || 'startpos';
      var replay = new Chess();
      var hdr = trial.header ? trial.header() : null;
      if (hdr && hdr.SetUp === '1' && hdr.FEN) replay.load(hdr.FEN);
      else if (fen0) replay.load(fen0);
      fenHistory = [replay.fen()];
      moveHistory = [];
      moveMarks = [];
      glyphMarks = [];
      whiteCaptured = [];
      blackCaptured = [];
      trial.history({verbose: true}).forEach(function(m) {
        var played = replay.move(m.san);
        moveHistory.push(m.san);
        fenHistory.push(played ? replay.fen() : trial.fen());
        if (m.captured) {
          if (m.color === 'w') blackCaptured.push(m.captured);
          else whiteCaptured.push(m.captured);
        }
      });
      viewIndex = moveHistory.length;
      isReplaying = false;
      isPaused = true;
      abandonedBy = null;
      board.position(game.fen());
      board.orientation(boardOrientation);
      selectedSquare = null;
      lastMoveMark = null;
      applyActiveOverlays();
      updateCapturedPieces();
      updateAdvantageBar(0);
      updateMoveList();
      updateGameResult();
      $('#pauseRestartButton').text('Start');
      updateStatus('Partita caricata: ' + (g.name == null ? '' : String(g.name)), 'success');
      $('#gameListContainer').addClass('d-none');
    })
    .withFailureHandler(function(err) {
      updateStatus('Errore: ' + (err && err.message ? err.message : err), 'danger');
    })
    .loadGame(String(id));
}

    })
    .deleteGame(String(id));
}

// Telecomando: due modi, scambiati solo dal tenuto di OK (500 ms). Il keyup dell'OK lungo non clicca.
// Scacchiera: frecce in senso visivo, clamp a1-h8, paint, OK breve = onSquareTap.
// Impostazioni: su/giù un controllo visibile, ordine di documento. Sinistra/destra sfoglia quel controllo.
// Canale breve (keyup, se il tenuto non è scattato) = Skill (#skillSlider).
// Canale tenuto 500 ms = Depth (#strengthSlider): + avanza, − cala; i repeat dopo la soglia continuano.
// Il keyup del tenuto non muove la Skill. Il breve non parte sul keydown. Il volume resta alla TV.
// canale-tenuto-depth. Non chiama scacchiTvMoveCursor.
(function () {
  var OK_MS = 500;
  var MARK = 'due-modi-ok-tenuto';
  var mode = 'board';
  var lastSettingsId = '';
  var held = {ok: false};
  var okTimer = 0;
  var okLong = false;
  var chTimer = 0;
  var chLong = false;
  var chDir = 0;
  var chHeld = false;
  var swallowClick = false;
  var seenDown = null;
  var seenUp = null;

  function stamp() {
    window.__scacchiTvNav = MARK;
    window.__scacchiTvMode = mode;
    if (document.documentElement) document.documentElement.setAttribute('data-tv-nav', MARK);
  }
  stamp();

  function eat(e) {
    if (!e) return;
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  function matchKey(e, name, codes) {
    if (e.key === name) return true;
    var c = e.keyCode || e.which || 0;
    var i;
    for (i = 0; i < codes.length; i++) if (codes[i] === c) break;
    if (i >= codes.length) return false;
    if (!e.key || e.key === 'Unidentified' || e.key === 'Process') return true;
    return false;
  }

  function isDown(e) { return matchKey(e, 'ArrowDown', [40, 20]); }
  function isRight(e) { return matchKey(e, 'ArrowRight', [39, 22]); }
  function isUp(e) { return matchKey(e, 'ArrowUp', [38, 19]); }
  function isLeft(e) { return matchKey(e, 'ArrowLeft', [37, 21]); }
  function isOk(e) { return matchKey(e, 'Enter', [13, 23]) || e.key === 'NumpadEnter'; }
  function isVolumeUp(e) { return e.key === 'VolumeUp' || e.key === 'AudioVolumeUp' || (e.keyCode || e.which) === 24; }
  function isVolumeDown(e) { return e.key === 'VolumeDown' || e.key === 'AudioVolumeDown' || (e.keyCode || e.which) === 25; }
  function isChannelUp(e) { return e.key === 'ChannelUp' || (e.keyCode || e.which) === 166; }
  function isChannelDown(e) { return e.key === 'ChannelDown' || (e.keyCode || e.which) === 167; }

  function shown(el) {
    if (!el || el.nodeType !== 1) return false;
    if (el.disabled) return false;
    if (el.classList && el.classList.contains('d-none')) return false;
    if (el.closest && el.closest('.d-none')) return false;
    if (el.hidden) return false;
    var s = window.getComputedStyle(el);
    return s.display !== 'none' && s.visibility !== 'hidden';
  }

  function isCoach(el) {
    if (!el || el.nodeType !== 1) return false;
    var id = el.id || '';
    if (id === 'coachToggle' || id === 'coachPanel' || id === 'coachLog' || id === 'reviewBtn') return true;
    if (el.classList && (el.classList.contains('coach-panel') || el.classList.contains('coach-note') || el.classList.contains('coach-log'))) return true;
    if (el.closest && (el.closest('#coachPanel') || el.closest('.coach-panel'))) return true;
    var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (el.tagName === 'BUTTON' && text === 'Consigli') return true;
    return false;
  }

  function visibleControls() {
    var nodes = document.querySelectorAll('button, input[type="range"], select, input[type="checkbox"]');
    var boardEl = document.getElementById('myBoard');
    var out = [];
    var i, el;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      if (el.id === 'myBoard') continue;
      if (boardEl && boardEl.contains(el)) continue;
      if (isCoach(el)) continue;
      if (!shown(el)) continue;
      out.push(el);
    }
    return out;
  }

  function promoButtons() {
    var promo = document.getElementById('promotionPicker');
    var nodes, out, i;
    if (!promo || !shown(promo)) return [];
    nodes = promo.querySelectorAll('button');
    out = [];
    for (i = 0; i < nodes.length; i++) if (shown(nodes[i])) out.push(nodes[i]);
    return out;
  }

  function orientation() {
    var o = '';
    try {
      if (typeof board !== 'undefined' && board && typeof board.orientation === 'function') o = board.orientation();
    } catch (err) {}
    if (o !== 'black' && o !== 'white') {
      o = (typeof boardOrientation !== 'undefined' && boardOrientation) ? boardOrientation : 'white';
    }
    return o === 'black' ? 'black' : 'white';
  }

  function paintSquare() {
    var old = document.querySelectorAll('#myBoard .tv-sq');
    var sq, el, i;
    for (i = 0; i < old.length; i++) old[i].classList.remove('tv-sq');
    if (mode !== 'board') return;
    sq = window.__scacchiTvSquare || 'e2';
    if (!/^[a-h][1-8]$/.test(sq)) sq = 'e2';
    window.__scacchiTvSquare = sq;
    el = document.querySelector('#myBoard .square-' + sq);
    if (el) el.classList.add('tv-sq');
  }

  function clearSquare() {
    var old = document.querySelectorAll('#myBoard .tv-sq');
    var i;
    for (i = 0; i < old.length; i++) old[i].classList.remove('tv-sq');
  }

  function moveSquareVisual(dir) {
    var sq = window.__scacchiTvSquare || 'e2';
    var file = sq.charCodeAt(0) - 97;
    var rank = parseInt(sq.charAt(1), 10);
    var black = orientation() === 'black';
    var dFile = 0;
    var dRank = 0;
    if (isNaN(file) || isNaN(rank)) { file = 4; rank = 2; }
    if (dir === 'up') dRank = black ? -1 : 1;
    else if (dir === 'down') dRank = black ? 1 : -1;
    else if (dir === 'left') dFile = black ? 1 : -1;
    else if (dir === 'right') dFile = black ? -1 : 1;
    file = Math.max(0, Math.min(7, file + dFile));
    rank = Math.max(1, Math.min(8, rank + dRank));
    window.__scacchiTvSquare = String.fromCharCode(97 + file) + rank;
    paintSquare();
  }

  function clearFocusMark() {
    var old = document.querySelectorAll('.tv-remote-focus');
    var i;
    for (i = 0; i < old.length; i++) old[i].classList.remove('tv-remote-focus');
  }

  function focusEl(el) {
    if (!el) return;
    try { el.focus({preventScroll: true}); }

  }

  function focusControl(el) {
    var row, marked;
    clearFocusMark();
    if (!el) return;
    row = null;
    if (el.closest) {
      if (el.type === 'checkbox') row = el.closest('.form-check');
      else if (el.type === 'range') row = el.closest('.slider-row');
    }
    marked = row || el;
    marked.classList.add('tv-remote-focus');
    focusEl(el);
    try { marked.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
    catch (err) { try { el.scrollIntoView(true); } catch (err2) {} }
    if (el.id) lastSettingsId = el.id;
    var prev = document.querySelectorAll('[data-tv-last]');
    var i;
    for (i = 0; i < prev.length; i++) prev[i].removeAttribute('data-tv-last');
    el.setAttribute('data-tv-last', '1');
  }

  function indexOf(list, el) {
    var i;
    for (i = 0; i < list.length; i++) if (list[i] === el) return i;
    return -1;
  }

  function stepSettings(dir) {
    var list = visibleControls();
    var ae, cur, next, i;
    if (!list.length) return;
    ae = document.activeElement;
    cur = indexOf(list, ae);
    if (cur < 0 && ae) {
      for (i = 0; i < list.length; i++) {
        if (list[i].contains && list[i].contains(ae)) { cur = i; break; }
      }
    }
    if (cur < 0) next = dir < 0 ? list.length - 1 : 0;
    else next = (cur + dir + list.length) % list.length;
    focusControl(list[next]);
  }

  function nudgeRange(el, dir) {
    var step = Number(el.step);
    var min, max, next;
    if (!step || step < 0 || isNaN(step)) step = 1;
    min = el.min === '' ? -Infinity : Number(el.min);
    max = el.max === '' ? Infinity : Number(el.max);
    next = Number(el.value);
    if (isNaN(next)) next = isFinite(min) ? min : 0;
    next += dir < 0 ? -step : step;
    if (isFinite(max) && next > max) next = max;
    if (isFinite(min) && next < min) next = min;
    if (Math.abs(next - Math.round(next)) < 1e-6) next = Math.round(next);
    el.value = String(next);
    el.dispatchEvent(new Event('input', {bubbles: true}));
    el.dispatchEvent(new Event('change', {bubbles: true}));
    return next;
  }

  function nudgeNamedSlider(id, dir) {
    var el = document.getElementById(id);
    if (!el) return;
    nudgeRange(el, dir);
  }

  function nudgeSelect(el, dir) {
    var opts = el.options;
    var n = opts.length;
    var i = el.selectedIndex;
    var step = dir < 0 ? -1 : 1;
    var k, j;
    if (!n) return;
    if (i < 0) i = dir < 0 ? 0 : n - 1;
    for (k = 1; k <= n; k++) {
      j = i + step * k;
      while (j < 0) j += n;
      while (j >= n) j -= n;
      if (opts[j].disabled) continue;
      if (j === i) return;
      el.selectedIndex = j;
      el.dispatchEvent(new Event('change', {bubbles: true}));
      return;
    }
  }

  function toggleCheck(el) {
    el.checked = !el.checked;
    el.dispatchEvent(new Event('input', {bubbles: true}));
    el.dispatchEvent(new Event('change', {bubbles: true}));
  }

  function nudgeFocused(dir) {
    var el = document.activeElement;
    if (!el || el === document.body || el === document.documentElement) {
      if (lastSettingsId) el = document.getElementById(lastSettingsId);
    }
    if (!el || el.nodeType !== 1) return;
    if (el.tagName === 'SELECT') {
      nudgeSelect(el, dir);
      focusControl(el);
      return;
    }
    if (el.tagName === 'INPUT' && el.type === 'range') {
      nudgeRange(el, dir);
      focusControl(el);
      return;
    }
    if (el.tagName === 'INPUT' && el.type === 'checkbox') {
      toggleCheck(el);
      focusControl(el);
    }
  }

  function revealBoard() {
    var setup = document.getElementById('setupContainer');
    var boardEl = document.getElementById('myBoard');
    var cancel;
    if (setup && shown(setup)) {
      cancel = document.getElementById('cancelSetup');
      if (cancel) cancel.click();
      else setup.classList.add('d-none');
    }
    if (boardEl) boardEl.classList.remove('d-none');
  }

  function enterBoard() {
    mode = 'board';
    window.__scacchiTvMode = 'board';
    clearFocusMark();
    revealBoard();
    var boardEl = document.getElementById('myBoard');
    if (!window.__scacchiTvSquare) window.__scacchiTvSquare = 'e2';
    if (boardEl) {
      boardEl.setAttribute('tabindex', '0');
      focusEl(boardEl);
      try { boardEl.scrollIntoView({block: 'nearest', inline: 'nearest'}); } catch (err) {}
    }
    paintSquare();
    stamp();
  }

  function enterSettings() {
    var list = visibleControls();
    var pick = null;
    var i;
    mode = 'settings';
    window.__scacchiTvMode = 'settings';
    clearSquare();
    if (!list.length) { stamp(); return; }
    for (i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-tv-last') === '1') { pick = list[i]; break; }
    }
    if (!pick && lastSettingsId) {
      for (i = 0; i < list.length; i++) if (list[i].id === lastSettingsId) { pick = list[i]; break; }
    }
    focusControl(pick || list[0]);
    stamp();
  }

  function toggleMode() {
    swallowClick = true;
    setTimeout(function () { swallowClick = false; }, 800);
    if (mode === 'board') enterSettings();
    else enterBoard();
  }

  function stepPromo(dir) {
    var list = promoButtons();
    var cur, next;
    if (!list.length) return;
    cur = indexOf(list, document.activeElement);
    if (cur < 0) next = dir < 0 ? list.length - 1 : 0;
    else next = (cur + dir + list.length) % list.length;
    focusControl(list[next]);
  }

  function shortOk() {
    var promo = promoButtons();
    var ae, i;
    if (promo.length) {
      ae = document.activeElement;
      for (i = 0; i < promo.length; i++) if (promo[i] === ae) { ae.click(); return; }
      focusControl(promo[0]);
      promo[0].click();
      return;
    }
    if (mode === 'board') {
      if (typeof onSquareTap === 'function') onSquareTap(window.__scacchiTvSquare || 'e2');
      paintSquare();
      return;
    }
    ae = document.activeElement;
    if (!ae || ae === document.body || ae === document.documentElement) {
      if (lastSettingsId) ae = document.getElementById(lastSettingsId);
    }
    if (!ae || ae.nodeType !== 1) return;
    if (ae.tagName === 'BUTTON') { ae.click(); return; }
    if (ae.tagName === 'INPUT' && ae.type === 'checkbox') toggleCheck(ae);
  }

  function onArrow(dir) {
    var promo = promoButtons();
    if (promo.length) {
      stepPromo(dir === 'up' || dir === 'left' ? -1 : 1);
      return;
    }
    if (mode === 'board') {
      moveSquareVisual(dir);
      return;
    }
    if (dir === 'up') stepSettings(-1);
    else if (dir === 'down') stepSettings(1);
    else nudgeFocused(dir === 'left' ? -1 : 1);
  }

  function onKeyDown(e) {
    var dir;
    if (seenDown === e) return;
    seenDown = e;
    if (isVolumeUp(e) || isVolumeDown(e)) {
      eat(e);
      return;
    }
    if (isChannelUp(e) || isChannelDown(e)) {
      var dir = isChannelUp(e) ? 1 : -1;
      eat(e);
      if (e.repeat) {
        if (chLong) nudgeNamedSlider('strengthSlider', dir);
        return;
      }
      if (chHeld) return;
      chHeld = true;
      chLong = false;
      chDir = dir;
      clearTimeout(chTimer);
      chTimer = setTimeout(function () {
        chLong = true;
        nudgeNamedSlider('strengthSlider', chDir);
      }, OK_MS);
      return;
    }
    if (isUp(e) || isDown(e) || isLeft(e) || isRight(e)) {
      eat(e);
      if (isUp(e)) dir = 'up';
      else if (isDown(e)) dir = 'down';
      else if (isLeft(e)) dir = 'left';
      else dir = 'right';
      onArrow(dir);
      return;
    }
    if (isOk(e)) {
      eat(e);
      if (e.repeat || held.ok) return;
      held.ok = true;
      okLong = false;
      clearTimeout(okTimer);
      okTimer = setTimeout(function () {
        okLong = true;
        toggleMode();
      }, OK_MS);
    }
  }

  function onKeyUp(e) {
    if (seenUp === e) return;
    seenUp = e;
    if (isChannelUp(e) || isChannelDown(e)) {
      eat(e);
      chHeld = false;
      clearTimeout(chTimer);
      chTimer = 0;
      if (chLong) {
        chLong = false;
        return;
      }
      nudgeNamedSlider('skillSlider', isChannelUp(e) ? 1 : -1);
      return;
    }
    if (isUp(e) || isDown(e) || isLeft(e) || isRight(e) || isVolumeUp(e) || isVolumeDown(e)) {
      eat(e);
      return;
    }
    if (!isOk(e)) return;
    eat(e);
    held.ok = false;
    clearTimeout(okTimer);
    if (okLong) {
      okLong = false;
      return;
    }
    shortOk();
  }

  function onPress(e) {
    if (isOk(e) || isUp(e) || isDown(e) || isLeft(e) || isRight(e) || isVolumeUp(e) || isVolumeDown(e) || isChannelUp(e) || isChannelDown(e)) eat(e);
  }

  function onClick(e) {
    if (!swallowClick) return;
    eat(e);
  }

  function watchBoard() {
    var boardEl = document.getElementById('myBoard');
    if (!boardEl || boardEl.getAttribute('data-tv-watch')) return;
    boardEl.setAttribute('data-tv-watch', '1');
    try {
      new MutationObserver(function () {
        var sq;
        if (mode !== 'board') return;
        sq = window.__scacchiTvSquare;
        if (!sq) return;
        if (!boardEl.querySelector('.square-' + sq + '.tv-sq')) paintSquare();
      }).observe(boardEl, {childList: true, subtree: true, attributes: true, attributeFilter: ['class']});
    } catch (err) {}
  }

  window.scacchiTvOnArrow = function (key) {
    if (key === 'ArrowUp') onArrow('up');
    else if (key === 'ArrowDown') onArrow('down');
    else if (key === 'ArrowLeft') onArrow('left');
    else if (key === 'ArrowRight') onArrow('right');
  };
  window.scacchiTvOnOk = function () { shortOk(); };
  window.scacchiTvEnterBoard = enterBoard;
  window.scacchiTvEnterSettings = enterSettings;

  function boot() {
    watchBoard();
    enterBoard();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(function () { stamp(); if (mode === 'board' && window.__scacchiTv) enterBoard(); }, 800);
  setTimeout(stamp, 2000);

  window.addEventListener('keydown', onKeyDown, true);
  document.addEventListener('keydown', onKeyDown, true);
  window.addEventListener('keyup', onKeyUp, true);
  document.addEventListener('keyup', onKeyUp, true);
  window.addEventListener('keypress', onPress, true);
  document.addEventListener('click', onClick, true);
  window.addEventListener('click', onClick, true);
})();
</script>
