// Build a data: URL for a themed SVG piece. `pieceCode` is the chessboard.js
// 2-char id, e.g. 'wK', 'bP'.
function buildSvgPiece(setId, pieceCode) {
  var set = SVG_PIECE_SETS[setId];
  if (!set) return '';
  var color = pieceCode.charAt(0);              // 'w' or 'b'
  var type  = pieceCode.charAt(1).toUpperCase();// K Q R B N P
  var fragment = set[type];
  if (!fragment) return '';
  var isWhite = (color === 'w');
  var fill    = isWhite ? '#f6e9c1' : '#1e1a14';
  var stroke  = '#1e1a14';
  var cutout  = isWhite ? '#1e1a14' : '#f6e9c1'; // contrast against body fill
  var lineCol = '#1e1a14';                       // stroke-only line work
  var sw      = isWhite ? '1.1' : '0.6';
  var body = fragment
    .replace(/@cutout/g, cutout)
    .replace(/@line/g,   lineCol);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"' +
            ' fill="' + fill + '" stroke="' + stroke +
            '" stroke-width="' + sw + '" stroke-linejoin="round">' +
            body + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

// Resolve the URL for a chessboard.js piece code given a theme that may be
// either a `{piece}`-template string OR a function (the SVG sets).
function resolvePieceUrl(theme, pieceCode) {
  if (typeof theme === 'function') return theme(pieceCode);
  if (typeof theme === 'string' && theme.indexOf('{piece}') !== -1) {
    return theme.replace('{piece}', pieceCode);
  }
  return pieceThemes['cburnett'].replace('{piece}', pieceCode);
}

// Custom HD PNG load: on failure show standard piece, retry with backoff + cache-bust.
var PIECE_FALLBACK_THEME = 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/{piece}.svg';
var _pieceImgRetry = Object.create(null);

function pieceFallbackUrl(pieceCode) {
  return PIECE_FALLBACK_THEME.replace('{piece}', pieceCode);
}

function isCustomHdUrl(url) {
  return typeof url === 'string' && /(?:^|\/)pieces\//.test(url) && /\.png(\?|$)/.test(url);
}

function cacheBustUrl(url, attempt) {
  var base = url.split('?')[0];
  return base + '?r=' + attempt + '_' + Date.now();
}

function schedulePieceImgRetry(img, originalUrl, pieceCode, attempt) {
  if (attempt > 8) return;
  var delay = Math.min(10000, Math.round(500 * Math.pow(2, Math.max(0, attempt - 1))));
  // attempt 1: 0.5s, 2:1s, 3:2s, 4:4s, 5:8s, then cap 10s
  var key = originalUrl.split('?')[0] + '|' + pieceCode;
  _pieceImgRetry[key] = setTimeout(function() {
    img.onerror = function() { onPieceImgError(img, originalUrl, pieceCode, attempt + 1); };
    img.onload = function() {
      img.onerror = null;
      img.onload = null;
      delete _pieceImgRetry[key];
    };
    img.src = cacheBustUrl(originalUrl, attempt + 1);
  }, delay);
}

function onPieceImgError(img, originalUrl, pieceCode, attempt) {
  attempt = attempt || 1;
  // Placeholder: standard piece (never broken icon)
  var fb = pieceFallbackUrl(pieceCode);
  if (img.getAttribute('data-piece-fallback') !== '1') {
    img.setAttribute('data-piece-fallback', '1');
    img.src = fb;
  }
  schedulePieceImgRetry(img, originalUrl, pieceCode, attempt);
}

function bindPieceImgRetry(root) {
  root = root || document;
  var imgs = root.querySelectorAll ? root.querySelectorAll('img') : [];
  for (var i = 0; i < imgs.length; i++) {
    var img = imgs[i];
    var src = img.getAttribute('src') || '';
    if (!isCustomHdUrl(src)) continue;
    if (img.getAttribute('data-piece-retry') === '1') continue;
    img.setAttribute('data-piece-retry', '1');
    (function(el, url) {
      var pieceCode = (url.match(/\/([wb][KQRBNP])\.png/) || [])[1] || '';
      el.onerror = function() { onPieceImgError(el, url.split('?')[0], pieceCode, 1); };
    })(img, src);
  }
  // chessboard.js uses background-image on .piece-417db
  var nodes = root.querySelectorAll ? root.querySelectorAll('.piece-417db') : [];
  for (var j = 0; j < nodes.length; j++) {
    var node = nodes[j];
    if (node.getAttribute('data-piece-retry') === '1') continue;
    var bg = (node.style && node.style.backgroundImage) || '';
    var m = bg.match(/url\(["']?(.*?)["']?\)/);
    if (!m || !isCustomHdUrl(m[1])) continue;
    node.setAttribute('data-piece-retry', '1');
    (function(el, url) {
      var pieceCode = (url.match(/\/([wb][KQRBNP])\.png/) || [])[1] || '';
      var probe = new Image();
      probe.onload = function() { /* ok */ };
      probe.onerror = function() {
        // show fallback via background while retrying
        el.style.backgroundImage = "url('" + pieceFallbackUrl(pieceCode) + "')";
        var attempt = 1;
        function retry() {
          if (attempt > 8) return;
          var delay = Math.min(10000, Math.round(500 * Math.pow(2, Math.max(0, attempt - 1))));
          setTimeout(function() {
            var bust = cacheBustUrl(url, attempt);
            var img2 = new Image();
            img2.onload = function() { el.style.backgroundImage = "url('" + bust + "')"; };
            img2.onerror = function() { attempt++; retry(); };
            img2.src = bust;
          }, delay);
        }
        retry();
      };
      probe.src = url;
    })(node, m[1]);
  }
}

var _pieceRetryObserver = null;
function startPieceImgRetryWatch() {
  bindPieceImgRetry(document);
  if (_pieceRetryObserver || typeof MutationObserver === 'undefined') return;
  _pieceRetryObserver = new MutationObserver(function(muts) {
    for (var i = 0; i < muts.length; i++) {
      var m = muts[i];
      if (m.type === 'childList') {
        for (var j = 0; j < m.addedNodes.length; j++) {
          var n = m.addedNodes[j];
          if (n && n.nodeType === 1) bindPieceImgRetry(n);
        }
      } else if (m.type === 'attributes') {
        bindPieceImgRetry(m.target.parentNode || document);
      }
    }
  });
  _pieceRetryObserver.observe(document.body, {
    childList: true, subtree: true,
    attributes: true, attributeFilter: ['style', 'src']
  });
}

function formatEvalLabel(scoreCp, mateN) {
  if (mateN != null && mateN !== 0) {
    var m = Math.abs(mateN);
    return (mateN > 0 ? 'M' : '-M') + m;
  }
  if (scoreCp == null || isNaN(scoreCp)) return '0';
  var pawns = scoreCp / 100;
  if (Math.abs(pawns) < 0.05) return '0';
  var sign = pawns > 0 ? '+' : '';
  var t = Math.abs(pawns) >= 10 ? pawns.toFixed(0) : pawns.toFixed(1);
  return sign + t;
}

function setEvalLabels(compact, verbose) {
  $('#scoreTextRail').text(compact);
  $('#scoreText, #scoreTextRight').text(verbose || compact);
}

function paintBars(whitePct) {
  var w = whitePct;
  if (w < 0) w = 0;
  if (w > 100) w = 100;
  var b = 100 - w;
  $('#advantageBarWhite').css({width: w + '%', height: '100%', flex: '0 0 ' + w + '%'});
  $('#advantageBarBlack').css({width: b + '%', height: '100%', flex: '0 0 ' + b + '%'});
  $('#advantageBarWhiteRight').css({height: w + '%', width: '100%'});
  $('#advantageBarBlackRight').css({height: b + '%', width: '100%'});
}

function paintMateBar(whiteMate) {
  var whitePct = whiteMate > 0 ? 100 : (whiteMate < 0 ? 0 : 50);
  paintBars(whitePct);
  var compact = formatEvalLabel(null, whiteMate);
  setEvalLabels(compact, 'matto in ' + Math.abs(whiteMate));
}

function postStop() {
  if (!stockfish) return;
  try { stockfish.postMessage('stop'); } catch (e) {}
}

function haltSearch() {
  searchId++;
  if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
  if (searchInFlight) {
    searchInFlight = 0;
    searchKind = '';
    awaitingStopBestmove = true;
    if (stopWaitTimer) clearTimeout(stopWaitTimer);
    stopWaitTimer = setTimeout(function() {
      stopWaitTimer = null;
      if (!awaitingStopBestmove) return;
      awaitingStopBestmove = false;
      if (pendingGo) flushGo();
    }, 400);
  }
  postStop();
}

function cancelSearch() {
  pendingGo = null;
  haltSearch();
}

function flushGo() {
  if (!pendingGo || !stockfish) return;
  var opts = pendingGo;
  if (opts.kind === 'game' && (isPaused || isReplaying || isSetupMode || matchOver())) {
    pendingGo = null;
    return;
  }
  pendingGo = null;
  searchId++;
  searchInFlight = searchId;
  searchKind = opts.kind;
  searchScore = null;
  searchFen = opts.fen || '';
  stockfish.postMessage('position fen ' + opts.fen);
  stockfish.postMessage('setoption name Skill Level value ' + opts.skill);
  stockfish.postMessage('go depth ' + opts.depth);
}

function queueSearch(opts) {
  haltSearch();
  if (opts.kind === 'game' && (isPaused || isReplaying || isSetupMode || matchOver())) return;
  pendingGo = opts;
  if (!awaitingStopBestmove) flushGo();
}

function noteEngineInfo(line) {
  if (!searchInFlight || searchInFlight !== searchId) return;
  var mate = line.match(/score mate (-?\d+)/);
  if (mate) {
    var n = parseInt(mate[1], 10);
    searchScore = {type: 'mate', value: n};
    // upperbound/lowerbound non sono un matto esatto: non contarli.
    if (line.indexOf('upperbound') === -1 && line.indexOf('lowerbound') === -1) {
      rememberChiVinceMate(searchFen, n);
      paintChiVinceFromMate();
    }
    if (searchKind === 'game') {
      var shown = game.turn() === 'b' ? -n : n;
      paintMateBar(shown);
    }
    return;
  }
  var cp = line.match(/score cp (-?\d+)/);
  if (!cp) return;
  var v = parseInt(cp[1], 10);
  searchScore = {type: 'cp', value: v};
  if (searchKind === 'game') {
    if (game.turn() === 'b') v = -v;
    updateAdvantageBar(v);
  }
}

function onStockfishLine(line) {
  console.log('Stockfish:', line);
  if (line.indexOf('uciok') !== -1 || line.indexOf('readyok') !== -1) {
    stockfishReady = true;
    if (!abandonedBy) updateStatus('Stockfish pronto!', 'success');
    if (line.indexOf('readyok') !== -1 && showChiVince) paintChiVince();
  }
  if (line.indexOf('score cp') !== -1 || line.indexOf('score mate') !== -1) noteEngineInfo(line);
  if (line.indexOf('bestmove') !== 0) return;
  if (awaitingStopBestmove && !searchInFlight) {
    awaitingStopBestmove = false;
    if (stopWaitTimer) { clearTimeout(stopWaitTimer); stopWaitTimer = null; }
    if (pendingGo) flushGo();
    else chiVinceEngineIdle();
    return;
  }
  var id = searchInFlight;
  var kind = searchKind;
  var score = searchScore;
  searchInFlight = 0;
  searchKind = '';
  if (!id || id !== searchId) return;
  var match = line.match(/bestmove\s+(\S+)/);
  var uci = match ? match[1] : '';
  if (kind === 'game') {
    if (!(isPaused || isReplaying || isSetupMode || abandonedBy)) applyEngineMove(uci);
    chiVinceEngineIdle();
    return;
  }
  if (kind === 'hint') {
    showHint(uci);
    chiVinceEngineIdle();
    return;
  }
  if (kind === 'chiVince') {
    chiVinceEngineIdle();
    return;
  }
  if (kind === 'coach' || kind === 'review' || kind === 'glyph') {
    onAnalysisBestmove(kind, uci, score);
    chiVinceEngineIdle();
  }
}

}

function matchOver() {
  return game.game_over() || !!abandonedBy;
}

function abandonText() {
  if (abandonedBy === 'w') return 'Il Bianco ha abbandonato.';
  if (abandonedBy === 'b') return 'Il Nero ha abbandonato.';
  return '';
}

function computerToMove() {
  var turn = game.turn();
  return (turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack);
}

function humanCanMove() {
  if (matchOver() || isSetupMode) return false;
  if (computerPlaysWhite && computerPlaysBlack) return false;
  var turn = game.turn();
  if (turn === 'w' && computerPlaysWhite) return false;
  if (turn === 'b' && computerPlaysBlack) return false;
  return true;
}

function endgameStatus() {
  if (abandonedBy) return {text: abandonText(), type: 'danger'};
  if (game.in_checkmate()) {
    var winner = game.turn() === 'w' ? 'Nero' : 'Bianco';
    return {text: 'Scaccomatto! ' + winner + ' vince', type: 'danger'};
  }
  if (game.in_draw()) return {text: 'Patta.', type: 'warning'};
  if (game.game_over()) return {text: 'Partita finita.', type: 'danger'};
  return null;
}

function statusAfterHumanMove() {
  var over = endgameStatus();
  if (over) {
    updateStatus(over.text, over.type);
    return;
  }
  if (computerToMove()) {
    updateStatus('Tocca al computer...', 'info');
    return;
  }
  updateStatus(game.turn() === 'w' ? 'Tocca al Bianco' : 'Tocca al Nero', 'info');
}

function noteCapture(move) {
  if (!move || !move.captured) return;
  if (move.color === 'w') blackCaptured.push(move.captured);
  else whiteCaptured.push(move.captured);
  updateCapturedPieces();
  if (showAnimazioni) boomOn(capturedSquare(move));
}

function scheduleComputerAfterHuman() {
  if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
  if (!matchOver() && computerToMove() && !isPaused && !isReplaying && !isSetupMode) {
    timeoutId = setTimeout(makeComputerMove, 600);
  }
}

function finishComputerMove(move, statusText, statusType, delay) {
  clearHint(true);
  recordMove(move.san);
  board.position(game.fen());
  selectedSquare = null;
  lastMoveMark = {
    from: move.from,
    to: move.to,
    cls: move.color === 'w' ? 'highlight-white' : 'highlight-black'
  };
  removeAllHighlights();
  noteCapture(move);
  updateGameResult();
  noteOpponentReply(move, true);
  var over = endgameStatus();
  if (over) {
    updateStatus(over.text, over.type);
    holdForGlyph(move);
    return;
  }
  updateStatus(statusText, statusType);
  if (holdForGlyph(move)) return;
  if (computerPlaysWhite && computerPlaysBlack && !abandonedBy && !isPaused && !isReplaying && !isSetupMode) {
    timeoutId = setTimeout(makeComputerMove, delay);
    return;
  }
  maybeAutoHint();
}

function applyEngineMove(uci) {
  if (abandonedBy || isPaused || isReplaying || isSetupMode) return;
  if (!uci || uci === '(none)') return;
  var move = game.move(uci, {sloppy: true});
  if (!move) return;
  finishComputerMove(move, 'Computer ha mosso: ' + move.san, 'success', 800);
}

function needsPromotion(from, to) {
  var piece = game.get(from);
  if (!piece || piece.type !== 'p') return false;
  var rank = to.charAt(1);
  if (piece.color === 'w' && rank === '8') return true;
  if (piece.color === 'b' && rank === '1') return true;
  return false;
}

function promotionLegal(from, to) {
  var ok = false;
  var pieces = ['q', 'r', 'b', 'n'];
  for (var i = 0; i < pieces.length; i++) {
    var m = game.move({from: from, to: to, promotion: pieces[i]});
    if (m) {
      game.undo();
      ok = true;
      break;
    }
  }
  return ok;
}

function showPromotionPicker(from, to) {
  promotionPending = {from: from, to: to};
  selectedSquare = from;
  highlightSelectedAndMoves(from);
  $('#promotionPicker').removeClass('d-none');
  updateStatus('Scegli la promozione: Q, R, B o N.', 'warning');
}

function hidePromotionPicker() {
  promotionPending = null;
  $('#promotionPicker').addClass('d-none');
}

function choosePromotion(promo) {
  var pending = promotionPending;
  hidePromotionPicker();
  if (!pending) return;
  if (promo !== 'q' && promo !== 'r' && promo !== 'b' && promo !== 'n') return;
  var move = game.move({from: pending.from, to: pending.to, promotion: promo});
  if (!move) {
    if (board) board.position(game.fen());
    updateStatus('Promozione non valida.', 'danger');
    return;
  }
  finishHumanMove(move);
}

function finishHumanMove(move) {
  hidePromotionPicker();
  clearHint(true);
  recordMove(move.san);
  selectedSquare = null;
  lastMoveMark = {
    from: move.from,
    to: move.to,
    cls: move.color === 'w' ? 'highlight-white' : 'highlight-black'
  };
  board.position(game.fen());
  removeAllHighlights();
  noteCapture(move);
  updateGameResult();
  statusAfterHumanMove();
  noteOpponentReply(move, false);
  if (coachPanelOpen() && stockfishReady && !isReplaying && !isSetupMode) {
    coachHoldsComputer = true;
    startCoachSingle(move);
    return;
  }
  coachHoldsComputer = false;
  if (holdForGlyph(move)) return;
  scheduleComputerAfterHuman();
}

function clearHint(silent) {
  hintOn = false;
  hintSquares = null;
  cancelHintSearch();
  var btn = document.getElementById('mossaMiglioreBtn');
  if (btn) {
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = 'Mossa migliore';
  }
  if (!silent && $('#myBoard .square-55d63').length) applyActiveOverlays();
}

function showHint(uci) {
  if (!hintOn) return;
  if (!uci || uci === '(none)' || uci.length < 4) {
    clearHint(false);
    updateStatus('Nessun suggerimento.', 'warning');
    return;
  }
  hintSquares = {from: uci.slice(0, 2), to: uci.slice(2, 4)};
  applyActiveOverlays();

function opponentEngineSettings() {
  // Skill/depth del computer avversario (slider primario = unico PC; in "entrambi" il più alto).
  if (computerPlaysWhite && computerPlaysBlack) {
    return {
      depth: Math.max(strengthLevel || 0, strengthLevelBlack || 0),
      skill: Math.max(skillLevel || 0, skillLevelBlack || 0)
    };
  }
  return { depth: strengthLevel || 0, skill: skillLevel || 0 };
}

function hintEngineSettings() {
  var opp = opponentEngineSettings();
  var depth = Math.min(STOCKFISH_MAX_DEPTH, (opp.depth || 0) + HINT_ENGINE_BOOST);
  var skill = Math.min(STOCKFISH_MAX_SKILL, (opp.skill || 0) + HINT_ENGINE_BOOST);
  if (depth < 0) depth = 0;
  if (skill < 0) skill = 0;
  return { depth: depth, skill: skill };
}

function hintDepth() {
  return hintEngineSettings().depth;
}

function cancelHintSearch() {
  hintSearchId++;
  hintSearchInFlight = 0;
  if (hintStockfish) {
    try { hintStockfish.postMessage('stop'); } catch (e) {}
  }
}

function onHintStockfishLine(line) {
  if (line.indexOf('uciok') !== -1 || line.indexOf('readyok') !== -1) {
    hintStockfishReady = true;
    return;
  }
  if (line.indexOf('bestmove') !== 0) return;
  var id = hintSearchInFlight;
  hintSearchInFlight = 0;
  if (!id || id !== hintSearchId) return;
  if (!hintOn) return;
  var match = line.match(/bestmove\s+(\S+)/);
  var uci = match ? match[1] : '';
  showHint(uci);
}

function runHintSearch(fen) {
  var opts = hintEngineSettings();
  fen = fen || game.fen();
  // Worker dedicato: non tocca skill/depth del motore di gioco.
  if (hintStockfish && hintStockfishReady) {
    hintSearchId++;
    hintSearchInFlight = hintSearchId;
    try {
      hintStockfish.postMessage('position fen ' + fen);
      hintStockfish.postMessage('setoption name Skill Level value ' + opts.skill);
      hintStockfish.postMessage('go depth ' + opts.depth);
    } catch (e) {
      hintSearchInFlight = 0;
    }
    return opts;
  }
  // Fallback sull'istanza principale solo se il worker hint non è pronto.
  if (stockfishReady) {
    queueSearch({kind: 'hint', depth: opts.depth, skill: opts.skill, fen: fen});
  }
  return opts;
}

function maybeAutoHint() {
  if (!showAutoHint) return;
  if (!humanCanMove()) return;
  if ((!stockfishReady && !hintStockfishReady) || isReplaying || isSetupMode || matchOver() || isPaused) return;
  if (glyphHold || coachHoldsComputer) return;
  if (analysis) return;
  if (computerToMove()) return;
  if (hintSearchInFlight) return;
  if (searchInFlight && searchKind === 'hint') return;
  hintOn = true;
  var btn = document.getElementById('mossaMiglioreBtn');
  if (btn) {
    btn.setAttribute('aria-pressed', 'true');
    btn.textContent = 'Nascondi suggerimento';
  }
  runHintSearch(game.fen());
}

function toggleHint() {
  if (hintOn) {
    clearHint(false);
    cancelHintSearch();
    if (searchKind === 'hint' || (searchInFlight && searchKind === 'hint')) cancelSearch();
    if (!isPaused && !isReplaying && !isSetupMode) scheduleComputerAfterHuman();
    return;
  }
  if ((!stockfishReady && !hintStockfishReady) || isReplaying || isSetupMode || matchOver()) {
    updateStatus('Suggerimento non disponibile.', 'warning');
    return;
  }
  abortAnalysis(false);
  hintOn = true;
  var btn = document.getElementById('mossaMiglioreBtn');
  if (btn) {
    btn.setAttribute('aria-pressed', 'true');
    btn.textContent = 'Nascondi suggerimento';
  }
  var opts = hintEngineSettings();
  updateStatus('Cerco la mossa migliore (skill ' + opts.skill + ', depth ' + opts.depth + ')...', 'info');
  runHintSearch(game.fen());
}

function scoreToCp(score) {
  if (!score) return null;
  if (score.type === 'mate') {
    var n = score.value;
    if (!n) return n > 0 ? 10000 : (n < 0 ? -10000 : 0);
    var sign = n > 0 ? 1 : -1;
    return sign * (10000 - Math.min(Math.abs(n), 50));
  }
  return score.value;
}

function lossCp(before, after) {
  var b = scoreToCp(before);
  var a = scoreToCp(after);
  if (b == null || a == null) return null;
  return b + a;
}

function pieceWorth(t) {
  if (t === 'q') return 9;
  if (t === 'r') return 5;
  if (t === 'b' || t === 'n') return 3;
  if (t === 'p') return 1;
  return 0;
}

function isPieceSacrifice(move) {
  if (!move || move.piece === 'p' || move.piece === 'k') return false;
  return pieceWorth(move.piece) > (move.captured ? pieceWorth(move.captured) : 0);
}

function classFromLoss(loss, same, beforeScore, pack) {
  if (loss == null) return '';
  if (loss >= 300) return 'blunder';
  if (loss >= 100) return 'mistake';
  if (loss >= 50) return 'inaccuracy';
  var before = scoreToCp(beforeScore);
  var afterMover = before == null ? null : before - loss;
  if (same && pack && isPieceSacrifice(pack.move) && before != null && before < 300 && afterMover > -200) return 'brilliant';
  if (same && before != null && afterMover != null && ((before <= -200 && afterMover >= -50) || (before > -50 && before < 50 && afterMover >= 200))) return 'great';
  if (same) return 'best';
  if (loss <= 0) return 'excellent';
  return 'good';
}

function noteGlyph(ctx, loss) {

    promotion: ctx.promotion,
    san: ctx.san
  });
  var same = pack ? sameUci(pack.move, ctx.bestUci) : false;
  glyphMarks[ctx.index] = classFromLoss(loss, same, ctx.scoreBefore, pack);
  paintGlyphs();
}

// Metrica aperture: identità della posizione (disposizione + tratto + arrocchi
// + en passant solo se la presa è legale), non il nome della prima mossa.
// Due ordini di mosse con la stessa chiave sono la stessa apertura.
// Somiglianza, solo se non c'è identità, solo su partite e finali: materiale
// identico; pedoni sulla stessa casa >= 80% di quelli del riferimento (o
// entrambi senza pedoni); pezzi uguali sulla stessa casa / pezzi del
// riferimento >= 0.75 e almeno 4. Sotto soglia non si scrive nulla.
// Partita famosa solo se la metrica la aggancia, con nome e anno.
// Ogni mossa: il libro è una mappa, l'archivio è piccolo.
var archivioData = null;
var archivioLoading = false;
var archivioWaiters = [];

function archivioKey(ch) {
  var fen = ch.fen().split(' ');
  var ep = '-';
  if (fen[3] && fen[3] !== '-') {
    var moves = ch.moves({verbose: true});
    var i;
    for (i = 0; i < moves.length; i++) {
      if (moves[i].flags && String(moves[i].flags).indexOf('e') !== -1) {
        ep = fen[3];
        break;
      }
    }
  }
  return fen[0] + ' ' + fen[1] + ' ' + fen[2] + ' ' + ep;
}

function archivioPieces(key) {
  var board = key.split(' ')[0];
  var ranks = board.split('/');
  var map = {};
  var counts = {};
  var pawns = [];
  var occ = 0;
  var r, file, i, ch, sq;
  for (r = 0; r < ranks.length; r++) {
    file = 0;
    for (i = 0; i < ranks[r].length; i++) {
      ch = ranks[r].charAt(i);
      if (ch >= '1' && ch <= '8') { file += parseInt(ch, 10); continue; }
      sq = String.fromCharCode(97 + file) + (8 - r);
      map[sq] = ch;
      counts[ch] = (counts[ch] || 0) + 1;
      if (ch === 'P' || ch === 'p') pawns.push(ch + sq);
      occ++;
      file++;
    }
  }
  return {map: map, counts: counts, pawns: pawns, occ: occ};
}

function archivioMaterialEqual(a, b) {
  var seen = {};
  var k;
  for (k in a.counts) seen[k] = 1;
  for (k in b.counts) seen[k] = 1;
  for (k in seen) if ((a.counts[k] || 0) !== (b.counts[k] || 0)) return false;
  return true;
}

function archivioPawnScore(query, ref) {
  if (!query.pawns.length && !ref.pawns.length) return 1;
  if (!query.pawns.length || !ref.pawns.length) return 0;
  var have = {};
  var i, hit = 0;
  for (i = 0; i < query.pawns.length; i++) have[query.pawns[i]] = 1;
  for (i = 0; i < ref.pawns.length; i++) if (have[ref.pawns[i]]) hit++;
  return hit / ref.pawns.length;
}

function archivioSameSquares(query, ref) {
  var n = 0;
  var sq;
  for (sq in ref.map) if (query.map[sq] === ref.map[sq]) n++;
  return n;
}

function archivioResembles(query, ref) {
  if (!archivioMaterialEqual(query, ref)) return false;
  if (archivioPawnScore(query, ref) < 0.8) return false;
  var same = archivioSameSquares(query, ref);
  if (same < 4 || ref.occ <= 0) return false;
  if (same / ref.occ < 0.75) return false;
  return true;
}

function archivioLabel(ch) {
  if (!archivioData || !ch) return '';
  var key = archivioKey(ch);
  if (archivioData.o && archivioData.o[key]) return 'Apertura: ' + archivioData.o[key];
  var i, item, q, ref, ratio, best = '', bestRatio = 0;
  var finals = archivioData.f || [];
  var games = archivioData.g || [];
  for (i = 0; i < finals.length; i++) {
    if (finals[i].k === key) return 'Finale: ' + finals[i].n;
  }
  for (i = 0; i < games.length; i++) {
    item = games[i];
    if (item.k === key && item.n && item.y) return 'Somiglia a ' + item.n + ', ' + item.y;
  }
  q = archivioPieces(key);
  for (i = 0; i < finals.length; i++) {
    ref = archivioPieces(finals[i].k);
    if (!archivioResembles(q, ref)) continue;
    ratio = archivioSameSquares(q, ref) / ref.occ;
    if (ratio > bestRatio) { bestRatio = ratio; best = 'Finale: ' + finals[i].n; }
  }
  for (i = 0; i < games.length; i++) {
    item = games[i];
    if (!item.n || !item.y) continue;
    ref = archivioPieces(item.k);
    if (!archivioResembles(q, ref)) continue;
    ratio = archivioSameSquares(q, ref) / ref.occ;
    if (ratio > bestRatio) { bestRatio = ratio; best = 'Somiglia a ' + item.n + ', ' + item.y; }
  }
  return best;
}

function archivioShow(text) {
  ['archivioNota', 'archivioNotaRight'].forEach(function(id) {

function paintApertura() {
  var moves = (moveHistory || []).slice(0, viewIndex);
  var text = '';
  if (!moves.length) {
    lastAperturaText = '';
  } else {
    try { text = openingFacts(moves) || ''; } catch (e) { text = ''; }
    if (text) lastAperturaText = text;
    else text = lastAperturaText;

// Tablebase Lichess, solo in rete, mai i file Syzygy. dtm è in semimosse
// (il server lo chiama «mate in X half-moves» e cala di 1 a ogni ply).
// «mate in N» di Lichess conta le mosse del vincitore: ceil(|dtm| / 2).
// Stockfish UCI «score mate N» è già in mosse, non in semimosse: |N|, non /2.
// Segno positivo: vince chi muove. upperbound/lowerbound non contano.
var chiVinceGen = 0;
var chiVinceFen = '';
var chiVinceTbOk = '';
var chiVinceTbMiss = '';
var chiVinceTried = '';

function pieceCountFen(fen) {
  var placement = String(fen || '').split(' ')[0];
  var n = 0;
  var i, c;
  for (i = 0; i < placement.length; i++) {
    c = placement.charAt(i);
    if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) n++;
  }
  return n;
}

function chiVinceShow(text) {
  ['chiVinceNota', 'chiVinceNotaRight'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el || (el.closest && el.closest('#myBoard'))) return;
    el.textContent = text || '';
    el.hidden = !text;
  });
}

function chiVinceWinPhrase(whiteWins, mosse) {
  if (!(mosse >= 1)) return '';
  var who = whiteWins ? 'Il Bianco' : 'Il Nero';
  return who + ' vince in ' + mosse + (mosse === 1 ? ' mossa' : ' mosse');
}

function chiVincePhrase(data, turn) {
  if (!data || typeof data.category !== 'string') return '';
  if (data.category === 'draw') return 'Patta';
  if (data.category !== 'win' && data.category !== 'loss') return '';
  if (typeof data.dtm !== 'number' || !isFinite(data.dtm)) return '';
  var mosse = Math.ceil(Math.abs(data.dtm) / 2);
  if (mosse < 1) return '';
  var whiteWins = (data.category === 'win') === (turn === 'w');
  return chiVinceWinPhrase(whiteWins, mosse);
}

function rememberChiVinceMate(fen, n) {
  if (!fen || typeof n !== 'number' || !isFinite(n) || n === 0) return;
  chiVinceMates[fen] = n;
}

function stockfishMatePhrase(fen) {
  if (!fen || !Object.prototype.hasOwnProperty.call(chiVinceMates, fen)) return '';
  var n = chiVinceMates[fen];
  if (typeof n !== 'number' || !isFinite(n) || n === 0) return '';
  var mosse = Math.abs(n);
  var turn = String(fen).split(' ')[1];
  var whiteWins = (n > 0) === (turn === 'w');
  return chiVinceWinPhrase(whiteWins, mosse);
}

function chiVinceFallbackOpen(fen) {
  if (!fen || !showChiVince) return false;
  if (chiVinceTbOk === fen) return false;
  if (pieceCountFen(fen) > 7) return true;
  return chiVinceTbMiss === fen;
}

function paintChiVinceFromMate() {
  if (!searchFen || !chiVinceFallbackOpen(searchFen)) return;
  var fen = '';
  try { fen = viewChess().fen(); } catch (e) { fen = ''; }
  if (fen !== searchFen) return;
  var phrase = stockfishMatePhrase(fen);
  if (phrase) chiVinceShow(phrase);
}

function maybeSearchChiVince(fen) {
  if (!showChiVince || !fen || !stockfish || !stockfishReady || isSetupMode) return;
  if (Object.prototype.hasOwnProperty.call(chiVinceMates, fen)) return;
  if (searchInFlight || pendingGo || awaitingStopBestmove) return;
  if (chiVinceTried === fen) return;
  if (!isPaused && !isReplaying && computerToMove() && !matchOver()) return;
  var ch = null;
  try { ch = viewChess(); } catch (e) { ch = null; }
  if (!ch || ch.fen() !== fen) return;
  if (ch.game_over && ch.game_over()) return;
  chiVinceTried = fen;
  queueSearch({kind: 'chiVince', depth: 16, skill: 20, fen: fen});
}

function showStockfishOrSearch(fen) {
  var phrase = stockfishMatePhrase(fen);
  chiVinceShow(phrase);
  if (!phrase) maybeSearchChiVince(fen);
}

function chiVinceEngineIdle() {
  if (!showChiVince) return;
  var fen = '';
  try { fen = viewChess().fen(); } catch (e) { fen = ''; }
  if (!fen || !chiVinceFallbackOpen(fen)) return;
  var phrase = stockfishMatePhrase(fen);
  if (phrase) chiVinceShow(phrase);
  else maybeSearchChiVince(fen);
}

function stopStaleChiVinceSearch(fen) {
  var stale = (searchKind === 'chiVince' && searchFen && searchFen !== fen) ||
    (pendingGo && pendingGo.kind === 'chiVince' && pendingGo.fen !== fen);
  if (!stale) return;
  if (searchFen && !Object.prototype.hasOwnProperty.call(chiVinceMates, searchFen)) chiVinceTried = '';
  cancelSearch();
}

function paintChiVince() {
  if (!showChiVince) {
    chiVinceGen++;
    chiVinceFen = '';
    chiVinceTbOk = '';
    chiVinceTbMiss = '';
    chiVinceTried = '';
    chiVinceShow('');
    if (searchKind === 'chiVince' || (pendingGo && pendingGo.kind === 'chiVince')) cancelSearch();
    return;
  }
  var ch = null;
  try { ch = viewChess(); } catch (e) { ch = null; }
  var fen = ch ? ch.fen() : '';
  if (!fen) {
    chiVinceGen++;
    chiVinceFen = '';
    chiVinceTbOk = '';
    chiVinceTbMiss = '';
    chiVinceShow('');
    return;
  }
  stopStaleChiVinceSearch(fen);
  if (pieceCountFen(fen) > 7) {
    chiVinceGen++;
    chiVinceTbOk = '';
    chiVinceTbMiss = '';
    chiVinceFen = fen;
    showStockfishOrSearch(fen);
    return;
  }
  if (fen === chiVinceFen) {
    if (chiVinceTbOk === fen) return;
    if (chiVinceTbMiss === fen) showStockfishOrSearch(fen);
    return;
  }
  chiVinceFen = fen;
  chiVinceTbOk = '';
  chiVinceTbMiss = '';
  var gen = ++chiVinceGen;
  var turn = fen.split(' ')[1];
  chiVinceShow('');
  fetch('https://tablebase.lichess.ovh/standard?fen=' + encodeURIComponent(fen)).then(function(r) {
    if (!r.ok) throw new Error('tablebase');
    return r.json();
  }).then(function(data) {
    if (gen !== chiVinceGen || !showChiVince || chiVinceFen !== fen) return;
    var phrase = chiVincePhrase(data, turn);
    if (phrase) {
      chiVinceTbOk = fen;
      chiVinceShow(phrase);
      return;
    }
    chiVinceTbMiss = fen;
    showStockfishOrSearch(fen);
  }).catch(function() {
    if (gen !== chiVinceGen || chiVinceFen !== fen || !showChiVince) return;
    chiVinceTbMiss = fen;
    showStockfishOrSearch(fen);
  });
}

function isLightSquare(square) {
  var file = square.charCodeAt(0) - 97;
  var rank = parseInt(square.charAt(1), 10);
  return ((file + rank) % 2) === 0;
}

function viewerPos(square) {
  var file = square.charCodeAt(0) - 97;
  var rank = parseInt(square.charAt(1), 10);
  if (boardOrientation === 'black') return { left: 7 - file, bottom: 8 - rank };
  return { left: file, bottom: rank - 1 };
}

function squaresOfType(ch, type, color) {
  var out = [];
  var files = 'abcdefgh';
  for (var f = 0; f < 8; f++) {
    for (var r = 1; r <= 8; r++) {
      var sq = files.charAt(f) + r;
      var p = ch.get(sq);
      if (p && p.type === type && p.color === color) out.push(sq);
    }
  }
  return out;
}

function pieceAdvancement(square, color) {
  var rank = parseInt(square.charAt(1), 10);
  return color === 'w' ? rank : (9 - rank);
}

function uniquelyAdvanced(square, mates, color) {
  if (mates.length < 2) return false;
  var mine = pieceAdvancement(square, color);
  for (var i = 0; i < mates.length; i++) {
    if (mates[i] === square) continue;
    if (pieceAdvancement(mates[i], color) >= mine) return false;
  }
  return true;
}

function uniqueVisual(square, mates) {
  if (mates.length < 2) return '';
  var positions = [];
  for (var i = 0; i < mates.length; i++) positions.push({ sq: mates[i], pos: viewerPos(mates[i]) });
  var me = viewerPos(square);
  var maxB = positions[0].pos.bottom, minB = maxB, maxL = positions[0].pos.left, minL = maxL;
  for (var j = 1; j < positions.length; j++) {
    if (positions[j].pos.bottom > maxB) maxB = positions[j].pos.bottom;
    if (positions[j].pos.bottom < minB) minB = positions[j].pos.bottom;
    if (positions[j].pos.left > maxL) maxL = positions[j].pos.left;
    if (positions[j].pos.left < minL) minL = positions[j].pos.left;
  }
  function only(pred) {
    var n = 0, hit = false;
    for (var k = 0; k < positions.length; k++) {
      if (!pred(positions[k])) continue;
      n++;
      if (positions[k].sq === square) hit = true;
    }
    return n === 1 && hit;
  }
  var top = me.bottom === maxB && maxB !== minB;
  var bottom = me.bottom === minB && maxB !== minB;
  var left = me.left === minL && maxL !== minL;
  var right = me.left === maxL && maxL !== minL;
  if (top && left && only(function(p) { return p.pos.bottom === maxB && p.pos.left === minL; })) return 'in alto a sinistra';
  if (top && right && only(function(p) { return p.pos.bottom === maxB && p.pos.left === maxL; })) return 'in alto a destra';
  if (bottom && left && only(function(p) { return p.pos.bottom === minB && p.pos.left === minL; })) return 'in basso a sinistra';
  if (bottom && right && only(function(p) { return p.pos.bottom === minB && p.pos.left === maxL; })) return 'in basso a destra';
  if (top && only(function(p) { return p.pos.bottom === maxB; })) return 'in alto';
  if (bottom && only(function(p) { return p.pos.bottom === minB; })) return 'in basso';
  if (left && only(function(p) { return p.pos.left === minL; })) return 'a sinistra';
  if (right && only(function(p) { return p.pos.left === maxL; })) return 'a destra';
  return '';
}

function onBackRank(square, color) {
  return (color === 'w' && square.charAt(1) === '1') || (color === 'b' && square.charAt(1) === '8');
}

function backRankDistinguishes(square, mates, color) {
  if (!onBackRank(square, color) || mates.length < 2) return false;
  for (var i = 0; i < mates.length; i++) if (!onBackRank(mates[i], color)) return true;
  return false;
}

function pieceNoun(type, yours) {
  var fem = type === 'r' || type === 'q';
  var name = { p: 'pedone', n: 'cavallo', b: 'alfiere', r: 'torre', q: 'donna', k: 're' }[type] || 'pezzo';
  if (yours) return fem ? 'la tua ' + name : 'il tuo ' + name;
  if (type === 'b') return "l'alfiere";
  if (fem) return 'la ' + name;
  return 'il ' + name;
}

function describePieceAt(ch, square, yours) {
  var p = ch.get(square);
  if (!p) return 'il pezzo';
  var mates = squaresOfType(ch, p.type, p.color);
  var trait = '';
  if (p.type !== 'k') {
    if (uniquelyAdvanced(square, mates, p.color)) trait = 'avanzato';
    else if (backRankDistinguishes(square, mates, p.color)) trait = 'base';
    else trait = uniqueVisual(square, mates);
  }
  var head = pieceNoun(p.type, yours);
  var adv = (p.type === 'r' || p.type === 'q') ? 'più avanzata' : 'più avanzato';
  if (p.type === 'b') {
    var col = isLightSquare(square) ? 'bianche' : 'nere';
    if (trait === 'avanzato') return head + ' ' + adv + ' sulle case ' + col;
    if (trait === 'base') return head + ' sulla fila di base, sulle case ' + col;
    if (trait) return head + ' che sta ' + trait + ', sulle case ' + col;
    return head + ' sulle case ' + col;
  }
  if (trait === 'avanzato') return head + ' ' + adv;
  if (trait === 'base') return head + ' sulla fila di base';
  if (trait) return head + ' che sta ' + trait;
  return head;
}

function italianSan(san) {
  if (!san) return '';
  var body = String(san).replace(/[+#]$/, '');
  return body.replace(/N/g, 'C').replace(/B/g, 'A').replace(/Q/g, 'D').replace(/R/g, 'T').replace(/K/g, 'R');
}

function glossPlayed(beforeFen, move, yours) {
  if (!move) return '';
  var symbol = italianSan(move.san);
  if (move.flags && move.flags.indexOf('k') !== -1) return symbol + ' (arrocco corto)';
  if (move.flags && move.flags.indexOf('q') !== -1) return symbol + ' (arrocco lungo)';
  var desc;
  if (move.promotion) {
    var pn = { q: 'donna', r: 'torre', b: 'alfiere', n: 'cavallo' }[move.promotion] || 'pezzo';
    desc = (yours ? 'il tuo pedone' : 'il pedone') + ' promosso a ' + pn + ', in ' + move.to;
  } else {
    var before = new Chess(beforeFen);
    var after = new Chess(beforeFen);
    var played = after.move({ from: move.from, to: move.to, promotion: move.promotion });
    var bare = pieceNoun(move.piece, yours);
    var afterDesc = played ? describePieceAt(after, move.to, yours) : '';
    var beforeDesc = describePieceAt(before, move.from, yours);
    var afterRole = afterDesc.indexOf('più avanzat') !== -1 || afterDesc.indexOf('fila di base') !== -1 || afterDesc.indexOf('case ') !== -1 || afterDesc.indexOf('che sta') !== -1;
    if (afterRole) desc = afterDesc + ', in ' + move.to;
    else if (beforeDesc && beforeDesc !== bare) desc = beforeDesc + ', che arriva in ' + move.to;
    else desc = (beforeDesc || bare) + ', in ' + move.to;
  }
  return symbol + ' (' + desc + ')';
}

function joinItalian(bits) {
  if (!bits.length) return '';
  if (bits.length === 1) return bits[0];
  var last = bits[bits.length - 1];
  var conj = /^e/i.test(last) ? ' ed ' : ' e ';
  return bits.slice(0, -1).join(', ') + conj + last;
}

function joinSquares(sqs) {
  return joinItalian(sqs);
}

function targetsPhrase(list) {
  var order = ['p', 'n', 'b', 'r', 'q'];
  var by = {};
  list.forEach(function(item) {
    if (!by[item.type]) by[item.type] = [];
    by[item.type].push(item.square);
  });
  var bits = [];
  order.forEach(function(t) {
    if (!by[t]) return;
    var sqs = by[t];
    if (t === 'b') {
      sqs.forEach(function(sq) {
        var col = isLightSquare(sq) ? 'bianche' : 'nere';
        bits.push("l'alfiere in " + sq + ' (sulle case ' + col + ')');
      });
      return;
    }
    var one = { p: 'il pedone', n: 'il cavallo', r: 'la torre', q: 'la donna', k: 'il re' }[t];
    var many = { p: 'i pedoni', n: 'i cavalli', r: 'le torri', q: 'le donne', k: 'i re' }[t];
    if (sqs.length === 1) bits.push(one + ' in ' + sqs[0]);
    else bits.push(many + ' in ' + joinSquares(sqs));
  });
  return joinItalian(bits);
}

function captureInfo(move) {
  if (!move || !move.captured) return null;
  var sq = move.to;
  if (move.flags && move.flags.indexOf('e') !== -1) {
    sq = move.to.charAt(0) + (move.color === 'w' ? '5' : '4');
  }
  return { type: move.captured, square: sq };
}

function attacksAfter(beforeFen, move) {
  var ch = new Chess(beforeFen);
  var played = ch.move({ from: move.from, to: move.to, promotion: move.promotion });
  if (!played) return [];
  var parts = ch.fen().split(' ');
  parts[1] = played.color;
  parts[3] = '-';
  var temp;
  try { temp = new Chess(parts.join(' ')); } catch (e) { return []; }
  var squares = [played.to];
  if (played.flags && played.flags.indexOf('k') !== -1) squares.push(played.color === 'w' ? 'f1' : 'f8');
  if (played.flags && played.flags.indexOf('q') !== -1) squares.push(played.color === 'w' ? 'd1' : 'd8');
  var out = [];
  var seen = {};
  squares.forEach(function(sq) {
    var list = [];
    try { list = temp.moves({ square: sq, verbose: true }) || []; } catch (e2) { list = []; }
    list.forEach(function(m) {
      if (!m.captured || m.captured === 'k' || seen[m.to]) return;
      seen[m.to] = true;
      out.push({ type: m.captured, square: m.to });
    });
  });
  return out;
}

function playOnFen(fen, spec) {
  var ch = new Chess(fen);
  var move = null;
  try {
    if (spec.uci) {
      var uci = String(spec.uci);
      move = ch.move(uci, { sloppy: true });
      if (!move && uci.length >= 4) {
        ch = new Chess(fen);
        var obj = { from: uci.slice(0, 2), to: uci.slice(2, 4) };
        if (uci.length > 4) obj.promotion = uci.charAt(4).toLowerCase();
        move = ch.move(obj);
      }
    } else if (spec.from && spec.to) {
      var obj2 = { from: spec.from, to: spec.to };
      if (spec.promotion) obj2.promotion = spec.promotion;
      move = ch.move(obj2);
      if (!move && spec.san) {
        ch = new Chess(fen);
        move = ch.move(spec.san) || ch.move(spec.san, { sloppy: true });
      }
    } else if (spec.san) {
      move = ch.move(spec.san) || ch.move(spec.san, { sloppy: true });
    }
  } catch (e) { move = null; }
  if (!move) return null;
  return { beforeFen: fen, move: move, after: ch };
}

function inspectPlayed(pack) {
  return {
    pack: pack,
    capture: captureInfo(pack.move),
    attacks: attacksAfter(pack.beforeFen, pack.move),
    check: pack.after.in_check(),
    mate: pack.after.in_checkmate()
  };
}

function sameUci(move, uci) {
  if (!move || !uci || uci === '(none)' || uci.length < 4) return false;
  if (uci.slice(0, 2) !== move.from || uci.slice(2, 4) !== move.to) return false;
  var promo = (move.promotion || '').toLowerCase();
  var bpromo = uci.length > 4 ? uci.charAt(4).toLowerCase() : '';
  return promo === bpromo;
}

function sideName(color, cap) {
  var n = color === 'w' ? 'Bianco' : 'Nero';
  return cap ? 'Il ' + n : 'il ' + n;
}

function sameLine(lead, info, yours) {
  var att = info.attacks.filter(function(a) { return a.type !== 'k'; });
  var text = lead;
  var verb = yours ? 'attacchi ' : 'attacca ';
  if (info.capture && att.length) text += ', catturando ' + targetsPhrase([info.capture]) + ', e ' + verb + targetsPhrase(att);
  else if (info.capture) text += ', catturando ' + targetsPhrase([info.capture]);
  else if (att.length) text += ' e ' + verb + targetsPhrase(att);
  if (info.mate) text += ' e ' + (yours ? 'hai dato scacco matto' : 'ha dato scacco matto');
  else if (info.check) text += ' e ' + (yours ? 'hai dato scacco' : 'ha dato scacco');
  return text + '.';
}

function playedTail(info, yours) {
  var cap = info.capture ? 'catturando ' + targetsPhrase([info.capture]) : '';
  var chk = '';
  if (info.mate) chk = yours ? 'hai dato scacco matto' : 'ha dato scacco matto';
  else if (info.check) chk = yours ? 'hai dato scacco' : 'ha dato scacco';
  if (cap && chk) return ', ' + cap + ', e ' + chk;
  if (cap) return ', ' + cap;
  if (chk) return ' e ' + chk;
  return '';
}

function consequence(best, played) {
  var touched = {};
  played.attacks.forEach(function(a) { touched[a.square] = true; });
  if (played.capture) touched[played.capture.square] = true;
  var verbs = [];
  if (best.capture && (!played.capture || played.capture.square !== best.capture.square)) {
    verbs.push('catturato ' + targetsPhrase([best.capture]));
  }
  var extra = best.attacks.filter(function(a) {
    if (touched[a.square]) return false;
    if (best.capture && a.square === best.capture.square) return false;
    return true;
  });
  if (extra.length) verbs.push('attaccato ' + targetsPhrase(extra));
  if (best.mate && !played.mate) verbs.push('dato scacco matto');
  else if (best.check && !played.check && !(best.mate && !played.mate)) verbs.push('dato scacco');
  return verbs;
}

function looksLikeUci(moves) {
  return !!(moves && moves.length && /^[a-h][1-8][a-h][1-8]/.test(moves[0]));
}

function prefixMatch(moves, seq) {
  if (!moves || !seq || moves.length < seq.length) return false;
  for (var i = 0; i < seq.length; i++) if (moves[i] !== seq[i]) return false;
  return true;
}

function openingForSide(moves, side) {
  var useUci = looksLikeUci(moves);
  var best = null;
  var bestLen = 0;
  for (var i = 0; i < OPENINGS.length; i++) {
    var o = OPENINGS[i];
    if (o.side !== side && o.side !== 'both') continue;
    var seq = useUci ? o.uci : o.san;
    if (!prefixMatch(moves, seq)) continue;
    if (!best || seq.length > bestLen) {
      best = o;
      bestLen = seq.length;
    }
  }
  return best;
}

function openingFacts(moves) {
  var white = openingForSide(moves, 'w');
  var black = openingForSide(moves, 'b');
  var bits = [];
  if (white) bits.push('Bianco: ' + white.name);
  if (black && (!white || black.id !== white.id)) bits.push('Nero: ' + black.name);
  else if (white && black && white.id === black.id) bits.push('entrambi: ' + white.name);
  return bits.join('. ');
}

function buildOpeningSentence(moves) {
  if (!moves || !moves.length) return '';
  var white = openingForSide(moves, 'w');
  var black = openingForSide(moves, 'b');
  var bothComputers = computerPlaysWhite && computerPlaysBlack;
  if (white && black && white.id === black.id) {
    if (bothComputers) return 'Il Bianco e il Nero stanno giocando ' + white.phrase + '.';
    return 'Stai giocando ' + white.phrase + '.';
  }
  if (bothComputers) {
    var bothBits = [];
    if (white) bothBits.push('Il Bianco sta giocando ' + white.phrase + '.');
    if (black) bothBits.push('Il Nero sta giocando ' + black.phrase + '.');
    return bothBits.join(' ');
  }
  var mine = humanColor === 'b' ? black : white;
  var theirs = humanColor === 'b' ? white : black;
  var theirLabel = humanColor === 'b' ? 'Il Bianco' : 'Il Nero';
  var parts = [];
  if (mine) parts.push('Stai giocando ' + mine.phrase + '.');
  if (theirs) parts.push(theirLabel + ' sta giocando ' + theirs.phrase + '.');
  return parts.join(' ');
}

function openingSentence(moves) {
  var white = openingForSide(moves, 'w');
  var black = openingForSide(moves, 'b');
  var key = (white ? white.id : '-') + '/' + (black ? black.id : '-');
  if (key === lastOpeningKey) return '';
  lastOpeningKey = key;
  return buildOpeningSentence(moves);
}

function attacksOn(ch, victimColor) {
  if (!ch) return [];
  var attacker = victimColor === 'w' ? 'b' : 'w';
  var parts = ch.fen().split(' ');
  parts[1] = attacker;
  parts[3] = '-';
  var temp;
  try { temp = new Chess(parts.join(' ')); } catch (e) { return []; }
  var list = [];
  try { list = temp.moves({ legal: false, verbose: true }) || []; } catch (e2) { return []; }
  var out = [];
  var seen = {};
  list.forEach(function(m) {
    if (!m.captured || m.captured === 'k' || seen[m.to]) return;
    seen[m.to] = true;
    out.push({ type: m.captured, square: m.to });
  });
  return out;
}

function situationSentence(after, moverColor, yours) {
  if (!after || !moverColor) return '';
  var other = moverColor === 'w' ? 'b' : 'w';
  var hanging = attacksOn(after, moverColor);
  var pressing = attacksOn(after, other);
  var bits = [];
  var inCheck = false;
  try { inCheck = after.in_check(); } catch (e) {}
  if (inCheck) bits.push('Il re è sotto scacco.');
  if (hanging.length) bits.push('Sotto attacco: ' + targetsPhrase(hanging) + '.');
  else if (!inCheck) bits.push(yours ? 'Nessun tuo pezzo è minacciato.' : 'Nessun pezzo di chi ha mosso è minacciato.');
  if (pressing.length) bits.push((yours ? 'Attacchi ' : 'Attacca ') + targetsPhrase(pressing) + '.');
  else bits.push(yours ? 'Con questa mossa non attacchi un pezzo.' : 'Con questa mossa non attacca un pezzo.');
  return bits.join(' ');
}

function finishComment(core, ctx, pack, yours) {
  var moves = [];
  if (ctx && ctx.index != null && ctx.index >= 0 && moveHistory) moves = moveHistory.slice(0, ctx.index + 1);
  var opening = openingSentence(moves);
  var sit = '';
  if (pack && pack.after && pack.move) sit = situationSentence(pack.after, pack.move.color, yours);
  var bits = [];
  if (opening) bits.push(opening);
  if (core) bits.push(core);
  if (sit) bits.push(sit);
  return bits.join(' ');
}

function firstSentences(text, n) {
  var s = String(text || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  var out = '';
  var count = 0;
  for (var i = 0; i < s.length && count < n; i++) {
    out += s.charAt(i);
    if (s.charAt(i) === '.' || s.charAt(i) === '!' || s.charAt(i) === '?') count++;
  }
  return out.trim();
}

function stripThink(text) {
  return String(text || '').replace(/<think>[\s\S]*?<\/think>/gi, ' ').replace(/<\/?think>/gi, ' ').replace(/\s+/g, ' ').trim();
}

function extractModelText(out) {
  if (!out) return '';
  if (typeof out === 'string') return stripThink(out);
  if (out.choices && out.choices[0] && out.choices[0].message) {
    return stripThink(out.choices[0].message.content || '');
  }
  var item = out[0] || out;
  var gen = item && item.generated_text;
  if (typeof gen === 'string') return stripThink(gen);
  if (gen && gen.length) {
    var last = gen[gen.length - 1];
    if (last && last.content) return stripThink(last.content);
    if (typeof last === 'string') return stripThink(last);
  }
  if (item && item.content) return stripThink(item.content);
  return '';
}

function showCoachWait(text) {
  if (!coachPanelOpen()) return;
  var log = document.getElementById('coachLog');
  if (!log) return;
  var p = document.getElementById('coachModelWait');
  if (!p) {
    p = document.createElement('p');
    p.id = 'coachModelWait';
    log.appendChild(p);
  }
  p.textContent = text;
  log.scrollTop = log.scrollHeight;
}

function hideCoachWait() {
  var p = document.getElementById('coachModelWait');
  if (p && p.parentNode) p.parentNode.removeChild(p);
}

function ensureCoachModel() {
  if (coachModelState === 'ready') return Promise.resolve(coachModel);
  if (coachModelState === 'failed') return Promise.resolve(null);
  if (coachModelPromise) return coachModelPromise;
  coachModelState = 'loading';
  showCoachWait('Sto caricando il modello…');
  coachModelPromise = import('https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js')
    .then(function(mod) {
      var Wllama = mod.Wllama;
      var engine = new Wllama({
        default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/wasm/wllama.wasm'
      });
      return engine.loadModelFromHF(
        { repo: 'unsloth/Qwen3-0.6B-GGUF', file: 'Qwen3-0.6B-Q4_K_M.gguf' },
        {
          n_ctx: 1024,
          n_threads: 1,
          n_gpu_layers: 0,
          progressCallback: function(prog) {
            var total = prog && prog.total;
            if (!total) {
              showCoachWait('Sto caricando il modello…');
              return;
            }
            var pct = Math.round(100 * (prog.loaded || 0) / total);
            showCoachWait('Sto caricando il modello… ' + pct + '%');
          }
        }
      ).then(function() {
        engine.chatTemplateKwargs = { enable_thinking: false };
        return engine;
      });
    })
    .then(function(engine) {
      coachModel = engine;
      coachModelState = 'ready';
      hideCoachWait();
      return engine;
    })
    .catch(function() {
      coachModelState = 'failed';
      coachModel = null;
      hideCoachWait();
      tellModelFailed();
      return null;
    });
  return coachModelPromise;
}

function tellModelFailed() {
  hideCoachWait();
  if (coachModelTold || !coachPanelOpen()) return;
  coachModelTold = true;
  appendCoach('il modello non è partito');
}

function attackSummary(beforeFen, spec) {
  if (!beforeFen || !spec) return 'non calcolata';
  var pack = playOnFen(beforeFen, spec);
  if (!pack) return 'non calcolata';
  var info = inspectPlayed(pack);
  var bits = [];
  if (info.capture) bits.push('cattura ' + targetsPhrase([info.capture]));
  var att = info.attacks.filter(function(a) { return a.type !== 'k'; });
  if (att.length) bits.push('attacca ' + targetsPhrase(att));
  if (info.mate) bits.push('scacco matto');
  else if (info.check) bits.push('scacco');
  if (!bits.length) return 'non attacca un pezzo';
  return bits.join(', ');
}

function graveLabel(loss) {
  if (loss == null) return 'non calcolato';
  return loss >= 200 ? 'sì' : 'no';
}

function askCoachModel(ctx, stockfishText) {
  if (!coachPanelOpen() || !moveHistory.length || !ctx) return;
  var idx = ctx.index != null ? ctx.index : (moveHistory.length - 1);
  if (idx < 0) idx = 0;
  var moves = moveHistory.slice(0, idx + 1);
  var opening = openingFacts(moves) || 'nessuna della tabella';
  var playedSpec = { from: ctx.from, to: ctx.to, promotion: ctx.promotion, san: ctx.san };
  var bestSpec = ctx.bestUci && ctx.bestUci !== '(none)' ? { uci: ctx.bestUci } : null;
  var snap = {
    fen: ctx.afterFen || '',
    san: ctx.san || '',
    bestUci: bestSpec ? ctx.bestUci : '',
    opening: opening,
    playedAttacks: attackSummary(ctx.beforeFen, playedSpec),
    bestAttacks: bestSpec ? attackSummary(ctx.beforeFen, bestSpec) : 'non indicata',
    grave: graveLabel(ctx.loss),
    stockfishText: stockfishText || ''
  };
  coachModelQueue.push(snap);
  if (coachModelQueue.length > 1) coachModelQueue = coachModelQueue.slice(-1);
  pumpCoachModel();
}

function pumpCoachModel() {
  if (coachModelBusy || !coachModelQueue.length) return;
  if (!coachPanelOpen()) {
    coachModelQueue = [];
    return;
  }
  coachModelBusy = true;
  var snap = coachModelQueue.shift();
  ensureCoachModel().then(function(engine) {
    if (!engine) {
      tellModelFailed();
      coachModelQueue = [];
      return null;
    }
    var user = 'Apertura dalla tabella: ' + snap.opening
      + '\nMossa giocata: ' + snap.san
      + '\nQuella mossa: ' + snap.playedAttacks
      + '\nMossa migliore di Stockfish, in UCI: ' + (snap.bestUci || 'non indicata')
      + '\nLa migliore: ' + snap.bestAttacks
      + '\nScarto grave, sopra 200 centipawn: ' + snap.grave
      + '\nPosizione FEN: ' + snap.fen
      + '\n' + snap.stockfishText
      + '\nScrivi tre o quattro frasi. Se sai l\'italiano, in italiano; altrimenti in inglese. Di\' che apertura è, solo col nome della tabella: se c\'è scritto nessuna della tabella, non inventarne una. Di\' se è una variante. Di\' se l\'errore è grave. Di\' cosa fare la prossima volta. Se la mossa giocata non è la migliore, scrivi l\'ipotesi: se avessi giocato la mossa migliore. Non citare partite famose.'
      + '\n/no_think';
    return engine.createChatCompletion({
      messages: [
        { role: 'system', content: 'Rispondi in tre o quattro frasi. Italiano se ci riesci, altrimenti inglese. Non inventare aperture. Non citare partite famose.' },
        { role: 'user', content: user }
      ],
      max_tokens: 220,
      temperature: 0.3,
      chat_template_kwargs: { enable_thinking: false }
    });
  }).then(function(out) {
    if (!out || !coachPanelOpen()) return;
    var text = firstSentences(extractModelText(out), 4);
    if (text) appendCoach(text);
  }).catch(function() {
    tellModelFailed();
    coachModelQueue = [];
  }).then(function() {
    coachModelBusy = false;
    pumpCoachModel();
  });
}

function commentForLoss(ctx) {
  if (!ctx || !ctx.beforeFen) return '';
  var pack = playOnFen(ctx.beforeFen, {
    from: ctx.from, to: ctx.to, promotion: ctx.promotion, san: ctx.san
  });
  var voice = ctx.voice || 'tu';
  if (voice === 'auto') voice = pack ? coachVoice(pack.move.color) : 'side';
  var yours = voice === 'tu';
  if (!pack) {
    var fb = italianSan(ctx.san || '');
    if (!fb) return '';
    var line = yours ? ('Hai giocato ' + fb + '.') : (ctx.color ? (sideName(ctx.color, true) + ' ha giocato ' + fb + '.') : (fb + '.'));
    return finishComment(line, ctx, null, yours);
  }
  var played = inspectPlayed(pack);
  var gloss = glossPlayed(ctx.beforeFen, pack.move, yours);
  var bestUci = ctx.bestUci;
  var same = sameUci(pack.move, bestUci);
  var leadSame = yours ? 'Hai giocato ' + gloss : sideName(pack.move.color, true) + ' ha giocato ' + gloss;
  if (same || !bestUci || bestUci === '(none)') {
    return finishComment(sameLine(leadSame, played, yours), ctx, pack, yours);
  }
  var bestPack = playOnFen(ctx.beforeFen, { uci: bestUci });
  if (!bestPack) return finishComment(leadSame + playedTail(played, yours) + '.', ctx, pack, yours);
  var best = inspectPlayed(bestPack);
  var verbs = consequence(best, played);
  var bestGloss = glossPlayed(ctx.beforeFen, bestPack.move, yours);
  var you = leadSame + playedTail(played, yours) + '.';
  if (!verbs.length) return finishComment('La migliore era ' + bestGloss + '. ' + you, ctx, pack, yours);
  if (yours) return finishComment('Se avessi giocato ' + bestGloss + ' avresti ' + joinItalian(verbs) + '. ' + you, ctx, pack, yours);
  return finishComment('Se ' + sideName(pack.move.color, false) + ' avesse giocato ' + bestGloss + ' avrebbe ' + joinItalian(verbs) + '. ' + you, ctx, pack, yours);
}

function replySentence(beforeFen, move, byComputer, check, mate) {
  var who = byComputer ? 'Il computer' : sideName(move.color, true);
  var gloss = glossPlayed(beforeFen, move, false);
  var text = who + ' ha risposto ' + gloss;
  var cap = captureInfo(move);
  var extra = [];
  if (cap) extra.push('catturando ' + targetsPhrase([cap]));
  if (mate) extra.push('ha dato scacco matto');
  else if (check) extra.push('ha dato scacco');
  if (cap && (check || mate)) text += ', ' + extra[0] + ', e ' + extra[1];
  else if (extra.length) text += ', ' + extra[0];
  text += '.';
  var after = new Chess(beforeFen);
  var played = null;
  try {
    played = after.move({ from: move.from, to: move.to, promotion: move.promotion });
  } catch (e) { played = null; }
  if (played) {
    var sit = situationSentence(after, move.color, false);
    if (sit) text += ' ' + sit;
  }
  return text;
}

function clearCoachLog() {
  coachReplyPending = false;
  lastOpeningKey = '';
  var log = document.getElementById('coachLog');
  if (log) log.textContent = '';

function computerMoved(color) {
  return (color === 'w' && computerPlaysWhite) || (color === 'b' && computerPlaysBlack);
}

function noteOpponentReply(move, byComputer) {
  if (!coachReplyPending || !move) return;
  coachReplyPending = false;
  if (!coachPanelOpen()) return;
  var before = fenHistory[viewIndex - 1];
  if (!before) return;
  var check = false;
  var mate = false;
  try {
    check = game.in_check();
    mate = game.in_checkmate();
  } catch (e) {}
  appendCoach(replySentence(before, move, byComputer, check, mate));
}

function replyForIndex(index) {
  if (index < 0 || !moveHistory || index >= moveHistory.length) return '';
  var before = fenHistory[index];
  if (!before) return '';
  var pack = playOnFen(before, { san: moveHistory[index] });
  if (!pack) return '';
  return replySentence(before, pack.move, computerMoved(pack.move.color), pack.after.in_check(), pack.after.in_checkmate());
}

function startCoachSingle(move) {
  var before = fenHistory[viewIndex - 1];
  if (!before || !move) {
    coachHoldsComputer = false;
    scheduleComputerAfterHuman();
    return;
  }
  analysis = {
    mode: 'coach',
    phase: 'before',
    beforeFen: before,
    afterFen: game.fen(),
    san: move.san,
    from: move.from,
    to: move.to,
    promotion: move.promotion || '',
    color: move.color,
    index: viewIndex - 1,
    voice: 'tu',
    scoreBefore: null,
    bestUci: null
  };
  queueSearch({kind: 'coach', depth: 8, skill: 20, fen: before});
}

function reviewAllowed() {
  return !!(moveHistory && moveHistory.length && (isPaused || abandonedBy || game.game_over()));
}

function startReview() {
  if (!reviewAllowed()) return;
  if (!stockfishReady) {
    appendCoach('Stockfish non è ancora pronto.');
    return;
  }
  abortAnalysis(false);
  clearHint(true);
  cancelSearch();
  moveMarks = [];
  glyphMarks = [];
  clearCoachLog();
  reviewTail = null;
  reviewIndex = 0;
  reviewStep();
}

function reviewStep() {
  if (reviewIndex < 0 || reviewIndex >= moveHistory.length) {
    reviewIndex = -1;
    updateMoveList();
    if (reviewTail) {
      askCoachModel(reviewTail, '');
      reviewTail = null;
    }
    return;
  }
  analysis = {
    mode: 'review',
    phase: 'before',
    beforeFen: fenHistory[reviewIndex],
    afterFen: fenHistory[reviewIndex + 1],
    san: moveHistory[reviewIndex],
    index: reviewIndex,
    voice: 'auto',
    scoreBefore: null,
    bestUci: null
  };
  queueSearch({kind: 'review', depth: 8, skill: 20, fen: analysis.beforeFen});
}

function onAnalysisBestmove(kind, uci, score) {
  var expect = kind === 'review' ? 'review' : (kind === 'glyph' ? 'glyph' : 'coach');
  if (!analysis || analysis.mode !== expect) return;
  if (analysis.mode === 'glyph') {
    if (analysis.phase === 'before') {
      analysis.scoreBefore = score;
      analysis.bestUci = uci;
      analysis.phase = 'after';
      if (analysis.afterFen) {
        queueSearch({kind: 'glyph', depth: 8, skill: 20, fen: analysis.afterFen});
        return;
      }
    }
    noteGlyph(analysis, lossCp(analysis.scoreBefore, score));
    analysis = null;
    releaseGlyphHold();
    return;
  }
  if (analysis.mode === 'coach') {
    if (analysis.phase === 'before') {
      analysis.scoreBefore = score;
      analysis.bestUci = uci;
      if (analysis.afterFen) {
        analysis.phase = 'after';
        queueSearch({kind: 'coach', depth: 8, skill: 20, fen: analysis.afterFen});
        return;
      }
    }
    if (analysis.phase === 'after') analysis.loss = lossCp(analysis.scoreBefore, score);
    noteGlyph(analysis, analysis.loss);
    var coachText = commentForLoss(analysis);
    if (coachText) appendCoach(coachText);
    askCoachModel(analysis, coachText);
    coachReplyPending = !matchOver();
    analysis = null;
    coachHoldsComputer = false;
    scheduleComputerAfterHuman();
    return;
  }
  if (analysis.phase === 'before') {
    analysis.scoreBefore = score;
    analysis.bestUci = uci;
    analysis.phase = 'after';
    queueSearch({kind: kind, depth: 8, skill: 20, fen: analysis.afterFen});
    return;
  }
  var loss = lossCp(analysis.scoreBefore, score);
  noteGlyph(analysis, loss);
  var text = commentForLoss(analysis);
  var idx = analysis.index;
  if (loss != null && loss >= 50) {
    moveMarks[idx] = loss >= 300 ? 'blunder' : (loss >= 100 ? 'mistake' : 'inaccuracy');
  }
  var reply = replyForIndex(idx + 1);
  if (reply) text = text ? (text + ' ' + reply) : reply;
  if (text) appendCoach((idx + 1) + '. ' + text);
  reviewTail = {

function resigningColor() {
  var turn = game.turn();
  var computerTurn = (turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack);
  if (!computerTurn) return turn;
  if (!computerPlaysWhite) return 'w';
  if (!computerPlaysBlack) return 'b';
  return turn;
}

function abandonGame() {
  if (isSetupMode || game.game_over() || abandonedBy) return;
  if (isReplaying && fenHistory && fenHistory.length) {
    goToMove(moveHistory.length);
    if (fenHistory[moveHistory.length]) game.load(fenHistory[moveHistory.length]);
  }
  abandonedBy = resigningColor();
  isPaused = true;
  selectedSquare = null;
  cancelSearch();
  hidePromotionPicker();
  clearHint(true);
  abortAnalysis(false);
  if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }

function castlingFromPosition(pos) {
  var rights = '';
  if (pos.e1 === 'wK' && pos.h1 === 'wR') rights += 'K';
  if (pos.e1 === 'wK' && pos.a1 === 'wR') rights += 'Q';
  if (pos.e8 === 'bK' && pos.h8 === 'bR') rights += 'k';
  if (pos.e8 === 'bK' && pos.a8 === 'bR') rights += 'q';
  return rights || '-';
}

function pgnForSave() {
  var pgn = game.pgn() || '';
  if (startFen && startFen !== 'startpos') {
    if (pgn.indexOf('[SetUp "1"]') === -1) {
      pgn = '[SetUp "1"]\n[FEN "' + String(startFen).replace(/"/g, '') + '"]\n' + pgn;
    }
    if (pgn.indexOf('\n\n') === -1) pgn = pgn.replace(/\s*$/, '') + '\n\n';
    var splitAt = pgn.indexOf('\n\n');
    if (!pgn.slice(splitAt + 2).trim()) {

}

var PIECE_VALUE = {p: 1, n: 3, b: 3, r: 5, q: 9};
var KING_ORDER = 100;
var BISHOP_DIR = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
var ROOK_DIR = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function sqXY(sq) {
  return {f: sq.charCodeAt(0) - 97, r: parseInt(sq.charAt(1), 10) - 1};
}

function sqName(f, r) {
  if (f < 0 || f > 7 || r < 0 || r > 7) return '';
  return String.fromCharCode(97 + f) + (r + 1);
}

function rayAttacks(occ, from, to, dirs) {
  var a = sqXY(from);
  var b = sqXY(to);
  var df = b.f - a.f;
  var dr = b.r - a.r;
  if (df === 0 && dr === 0) return false;
  var stepF = df === 0 ? 0 : (df > 0 ? 1 : -1);
  var stepR = dr === 0 ? 0 : (dr > 0 ? 1 : -1);
  if (stepF !== 0 && stepR !== 0 && Math.abs(df) !== Math.abs(dr)) return false;
  var okDir = false;
  var i;
  for (i = 0; i < dirs.length; i++) {
    if (dirs[i][0] === stepF && dirs[i][1] === stepR) { okDir = true; break; }
  }
  if (!okDir) return false;
  var f = a.f + stepF;
  var r = a.r + stepR;
  while (f !== b.f || r !== b.r) {
    if (occ[sqName(f, r)]) return false;
    f += stepF;
    r += stepR;
  }
  return true;
}

function geometricallyAttacks(occ, from, to) {
  if (!from || !to || from === to) return false;
  var piece = occ[from];
  if (!piece) return false;
  var a = sqXY(from);
  var b = sqXY(to);
  var df = b.f - a.f;
  var dr = b.r - a.r;
  var adf = Math.abs(df);
  var adr = Math.abs(dr);
  if (piece.type === 'p') {
    var fwd = piece.color === 'w' ? 1 : -1;
    return dr === fwd && adf === 1;
  }
  if (piece.type === 'n') return (adf === 1 && adr === 2) || (adf === 2 && adr === 1);
  if (piece.type === 'k') return adf <= 1 && adr <= 1 && (adf + adr > 0);
  if (piece.type === 'b') return rayAttacks(occ, from, to, BISHOP_DIR);
  if (piece.type === 'r') return rayAttacks(occ, from, to, ROOK_DIR);
  if (piece.type === 'q') return rayAttacks(occ, from, to, BISHOP_DIR.concat(ROOK_DIR));
  return false;
}

function kingSquare(occ, color) {
  var squares = Object.keys(occ);
  var i;
  for (i = 0; i < squares.length; i++) {
    var p = occ[squares[i]];
    if (p && p.type === 'k' && p.color === color) return squares[i];
  }
  return '';
}

function kingAttacked(occ, color) {
  var king = kingSquare(occ, color);
  if (!king) return false;
  var squares = Object.keys(occ);
  var i;
  for (i = 0; i < squares.length; i++) {
    var p = occ[squares[i]];
    if (!p || p.color === color) continue;
    if (geometricallyAttacks(occ, squares[i], king)) return true;
  }
  return false;
}

function cloneOcc(occ) {
  var next = {};
  var squares = Object.keys(occ);
  var i;
  for (i = 0; i < squares.length; i++) {
    var p = occ[squares[i]];
    next[squares[i]] = {type: p.type, color: p.color};
  }
  return next;
}

function canLegallyCaptureOn(occ, from, to) {
  var piece = occ[from];
  if (!piece || from === to) return false;
  if (!geometricallyAttacks(occ, from, to)) return false;
  var next = cloneOcc(occ);
  delete next[from];
  next[to] = {type: piece.type, color: piece.color};
  return !kingAttacked(next, piece.color);
}

function legalCaptors(occ, square, side) {
  var out = [];
  var squares = Object.keys(occ);
  var i;
  for (i = 0; i < squares.length; i++) {
    var from = squares[i];
    var p = occ[from];
    if (!p || p.color !== side || from === square) continue;
    if (p.type !== 'k' && !PIECE_VALUE[p.type]) continue;
    if (!canLegallyCaptureOn(occ, from, square)) continue;
    out.push({
      square: from,
      type: p.type,
      color: p.color,
      value: p.type === 'k' ? KING_ORDER : PIECE_VALUE[p.type]
    });
  }
  return out;
}

function applyCapture(occ, from, to) {
  var next = cloneOcc(occ);
  var mover = next[from];
  delete next[from];
  next[to] = {type: mover.type, color: mover.color};
  return next;
}

function seeExchange(occ, square, side, captureValue, depth) {
  if ((depth || 0) > 32) return 0;
  var options = legalCaptors(occ, square, side);
  if (!options.length) return 0;
  var minVal = options[0].value;
  var i;
  for (i = 1; i < options.length; i++) if (options[i].value < minVal) minVal = options[i].value;
  var best = 0;
  for (i = 0; i < options.length; i++) {
    if (options[i].value !== minVal) continue;
    var mover = options[i];
    var next = applyCapture(occ, mover.square, square);
    var landedVal = mover.value;
    if (mover.type === 'p' && ((mover.color === 'w' && square.charAt(1) === '8') || (mover.color === 'b' && square.charAt(1) === '1'))) {
      next[square] = {type: 'q', color: mover.color};
      landedVal = 9;
    }
    var recapture = seeExchange(next, square, side === 'w' ? 'b' : 'w', landedVal, (depth || 0) + 1);
    var gain = captureValue - recapture;
    if (gain < 0) gain = 0;
    if (gain > best) best = gain;
  }
  return best;
}

function isSquareInPresa(occ, square) {
  var piece = occ[square];
  if (!piece || piece.type === 'k' || !PIECE_VALUE[piece.type]) return false;
  var enemy = piece.color === 'w' ? 'b' : 'w';
  return seeExchange(occ, square, enemy, PIECE_VALUE[piece.type], 0) > 0;
}

function boardOccupancy(ch) {
  var occ = {};
  allSquares().forEach(function(square) {
    var p = ch.get(square);
    if (p) occ[square] = {type: p.type, color: p.color};
  });
  return occ;
}

function paintEnPrise() {
  // in-presa-scambio: catena sulla stessa casa, non qualsiasi attacco.
  // Chi attacca prende col più economico che può farlo legalmente, poi il
  // difensore riprende col suo più economico. Si smette se il colpo successivo
  // fa guadagnare meno di quanto si perde. In presa solo se chi ha iniziato
  // guadagna più punti di chi difendeva. Pari o in perdita: no. Entrambi i
  // colori. Il re non si colora. Pedone 1, cavallo 3, alfiere 3, torre 5, donna 9.
  if (!showEnPrise) return;
  var occ = boardOccupancy(viewChess());
  allSquares().forEach(function(square) {
    if (isSquareInPresa(occ, square)) {
      $('#myBoard .square-' + square).addClass('hl-en-prise');
    }
  });
}

function paintLegal(square) {
  var ch = viewChess();
  var piece = ch.get(square);
  if (!piece) return;
  var temp = ch;
  if (ch.turn() !== piece.color) {
    var parts = ch.fen().split(' ');
    parts[1] = piece.color;
    parts[3] = '-';
    try { temp = new Chess(parts.join(' ')); } catch (e) { return; }
  }
  temp.moves({ square: square, verbose: true }).forEach(function(m) {
    $('#myBoard .square-' + m.to).addClass(m.captured ? 'hl-legal-capture' : 'highlight-legal');
  });
}

function squaresControlledBy(square) {
  var ch = viewChess();
  var piece = ch.get(square);
  if (!piece) return [];
  if (typeof ch.attacks === 'function') {
    try { return ch.attacks(square) || []; } catch (e) {}
  }
  var out = [];
  allSquares().forEach(function(target) {
    if (getAttackers(target, piece.color, true, true).indexOf(square) !== -1) {
      out.push(target);
    }
  });
  return out;
}

function paintControlled(square) {
  squaresControlledBy(square).forEach(function(target) {
    $('#myBoard .square-' + target).addClass('hl-controlled');
  });
}

function paintSafeEmpty() {
  var ch = viewChess();
  var enemy = ch.turn() === 'w' ? 'b' : 'w';
  allSquares().forEach(function(square) {
    if (ch.get(square)) return;
    if (!getAttackers(square, enemy, true, true).length) {
      $('#myBoard .square-' + square).addClass('hl-safe-empty');
    }
  });
}

function attackersOf(square) {
  var ch = viewChess();
  var out = [];
  var seen = {};
  ['w', 'b'].forEach(function(color) {
    getAttackers(square, color, true, true).forEach(function(from) {
      if (seen[from]) return;
      seen[from] = true;
      var p = ch.get(from);
      out.push({ from: from, color: color, type: p ? p.type : '' });
    });
  });
  return out;
}

function paintInspect(square) {
  $('#myBoard .square-' + square).addClass('hl-inspect-target');
  attackersOf(square).forEach(function(a) {
    $('#myBoard .square-' + a.from).addClass('hl-inspect-attacker');
  });
}

function announceInspect(square) {
  var nomi = { p: 'pedone', n: 'cavallo', b: 'alfiere', r: 'torre', q: 'donna', k: 're' };
  var colori = { w: 'Bianco', b: 'Nero' };
  var list = attackersOf(square);
  if (!list.length) {
    updateStatus(square + ' non è attaccata.', 'info');
    return;
  }
  var bits = list.map(function(a) {
    return (nomi[a.type] || 'pezzo') + ' ' + (colori[a.color] || '') + ' in ' + a.from;
  });
  updateStatus(square + ' è attaccata da: ' + bits.join(', ') + '.', 'warning');
}

function highlightThreatsAndUnprotected() {
  if (!showUnderAttack) return;
  paintUnderAttack();
}

function selectPieceForOverlay(square) {
  var piece = viewChess().get(square);
  if (!piece) {
    selectedSquare = null;
    removeAllHighlights();
    return;
  }
  selectedSquare = square;
  highlightSelectedAndMoves(square);
}

function onBoardSquareClick(square) {
  if (isSetupMode) return;
  if (promotionPending) {
    if (square === promotionPending.from) {
      hidePromotionPicker();
      selectedSquare = null;
      removeAllHighlights();
      updateStatus(game.turn() === 'w' ? 'Tocca al Bianco' : 'Tocca al Nero', 'info');
    }
    return;
  }
  if (showInspect) {
    inspectSquare = square;
    applyActiveOverlays();
    announceInspect(square);
    return;
  }
  if (isMobile && !matchOver()) {
    onSquareTap(square);
    return;
  }
  if (showLegal || showControlled) selectPieceForOverlay(square);
}

function bindBoardClicks() {

function bindOverlaySwitches() {
  function wire(id, key, apply) {
    $('#' + id).on('change', function() {
      apply($(this).is(':checked'));
      try { localStorage.setItem(key, $(this).is(':checked') ? '1' : '0'); } catch (e) {}
      applyActiveOverlays();
    });
  }
  wire('switchSottoAttacco', 'scacchi-switch-sotto-attacco', function(on) { showUnderAttack = on; });
  wire('switchInPresa', 'scacchi-switch-in-presa', function(on) { showEnPrise = on; });
  wire('switchDovePuoAndare', 'scacchi-switch-dove', function(on) { showLegal = on; });
  wire('switchCaselleControllate', 'scacchi-switch-controllate', function(on) { showControlled = on; });

  wire('switchCaselleLibere', 'scacchi-switch-libere', function(on) { showSafeEmpty = on; });
  wire('switchAnimazioni', 'scacchi-switch-animazioni', function(on) {

    paintGlyphs();

  wire('switchArchivio', 'scacchi-switch-archivio', function(on) {

  document.addEventListener('pointerdown', function() {
    if (showAnimazioni) resumeAnimAudio();
  });
}

function resumeAnimAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!animAudioCtx) {
    try { animAudioCtx = new AC(); } catch (e) { return null; }
  }
  if (animAudioCtx.state === 'suspended') {
    try { animAudioCtx.resume(); } catch (e2) {}
  }
  return animAudioCtx;
}

function playBoom() {
  var ctx = resumeAnimAudio();
  if (!ctx) return;
  function start() { playBoomNow(ctx); }
  if (ctx.state === 'running') { start(); return; }
  var pending = ctx.resume();
  if (pending && pending.then) pending.then(start);
}

function playBoomNow(ctx) {
  var t = ctx.currentTime;
  var dur = 0.36;
  var len = Math.floor(ctx.sampleRate * dur);
  var buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  var data = buffer.getChannelData(0);
  var i;
  for (i = 0; i < len; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.8);
  }
  var noise = ctx.createBufferSource();
  noise.buffer = buffer;
  var filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2200, t);
  filter.frequency.exponentialRampToValueAtTime(140, t + 0.28);
  var ng = ctx.createGain();
  ng.gain.setValueAtTime(0.28, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  noise.connect(filter);
  filter.connect(ng);
  ng.connect(ctx.destination);
  noise.start(t);
  noise.stop(t + dur);

  var osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(90 + Math.random() * 50, t);
  osc.frequency.exponentialRampToValueAtTime(36, t + 0.22);
  var og = ctx.createGain();
  og.gain.setValueAtTime(0.34, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  osc.connect(og);
  og.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.28);
}

function capturedSquare(move) {
  if (!move || !move.captured) return '';
  var flags = move.flags || '';
  if (flags.indexOf('e') !== -1 && move.from && move.to) {
    return move.to.charAt(0) + move.from.charAt(1);
  }
  return move.to || '';
}
