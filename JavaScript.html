// Build a data: URL for a themed SVG piece. `pieceCode` is the chessboard.js
// 2-char id, e.g. 'wK', 'bP'.
function buildSvgPiece(setId, pieceCode) {
  var set = SVG_PIECE_SETS[setId];
  if (!set) return '';
  var color = pieceCode.charAt(0);              // 'w' or 'b'
  var type  = pieceCode.charAt(1).toUpperCase();// K Q R B N P
  var fragment = set[type];
  if (!fragment) return '';
  var isWhite = (color === 'w');
  var fill    = isWhite ? '#f6e9c1' : '#1e1a14';
  var stroke  = '#1e1a14';
  var cutout  = isWhite ? '#1e1a14' : '#f6e9c1'; // contrast against body fill
  var lineCol = '#1e1a14';                       // stroke-only line work
  var sw      = isWhite ? '1.1' : '0.6';
  var body = fragment
    .replace(/@cutout/g, cutout)
    .replace(/@line/g,   lineCol);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"' +
            ' fill="' + fill + '" stroke="' + stroke +
            '" stroke-width="' + sw + '" stroke-linejoin="round">' +
            body + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

// Resolve the URL for a chessboard.js piece code given a theme that may be
// either a `{piece}`-template string OR a function (the SVG sets).
function resolvePieceUrl(theme, pieceCode) {
  if (typeof theme === 'function') return theme(pieceCode);
  if (typeof theme === 'string' && theme.indexOf('{piece}') !== -1) {
    return theme.replace('{piece}', pieceCode);
  }
  return pieceThemes['cburnett'].replace('{piece}', pieceCode);
}

function replaceFenSquare(fenBoard, square, newPiece) {
  var boardArray = fenBoard.split('/');
  var rowIndex = 8 - parseInt(square[1]);
  var colIndex = square.charCodeAt(0) - 97;
  var cells = [];
  var rowStr = boardArray[rowIndex];
  for (var i = 0; i < rowStr.length; i++) {
    if (/\d/.test(rowStr[i])) {
      for (var k = 0; k < parseInt(rowStr[i]); k++) cells.push('.');
    } else {
      cells.push(rowStr[i]);
    }
  }
  cells[colIndex] = newPiece !== null ? newPiece : '.';
  var newRow = '', count = 0;
  for (var j = 0; j < cells.length; j++) {
    if (cells[j] === '.') { count++; }
    else { if (count > 0) { newRow += count; count = 0; } newRow += cells[j]; }
  }
  if (count > 0) newRow += count;
  boardArray[rowIndex] = newRow;
  return boardArray.join('/');
}

function getAttackers(targetSquare, attackerColor, isFriendly) {
  var fenParts = game.fen().split(' ');
  fenParts[1] = attackerColor;
  fenParts[3] = '-';
  if (isFriendly) {
    var dummyPiece = attackerColor === 'w' ? 'p' : 'P';
    fenParts[0] = replaceFenSquare(fenParts[0], targetSquare, dummyPiece);
  }
  var attackers = [];
  try {
    var tempGame = new Chess(fenParts.join(' '));
    tempGame.moves({verbose: true}).forEach(function(m) {
      if (m.to === targetSquare) attackers.push(m.from);
    });
  } catch(e) { console.warn('getAttackers error:', e); }
  return attackers;
}

function highlightThreatsAndUnprotected() {
  removeAllHighlights();
  if (computerPlaysWhite && computerPlaysBlack) return;
  if (!computerPlaysWhite && !computerPlaysBlack) return;
  if (game.turn() !== humanColor) return;
  var squares = [];
  for (var row = 0; row < 8; row++) {
    for (var col = 0; col < 8; col++) {
      var square = String.fromCharCode(97 + col) + (8 - row);
      var piece = game.get(square);
      if (piece && piece.color === humanColor) squares.push(square);
    }
  }
  var enemyColor = humanColor === 'w' ? 'b' : 'w';
  squares.forEach(function(square) {
    var enemyAttackers = getAttackers(square, enemyColor, false);
    var friendlyProtectors = getAttackers(square, humanColor, true);
    if (enemyAttackers.length > 0) {
      $('#myBoard .square-' + square).addClass('threatened-piece');
    }
    if (friendlyProtectors.length === 0 && enemyAttackers.length > 0) {
      $('#myBoard .square-' + square).addClass('unprotected-piece');
    }
  });
}

function updateAdvantageBar(score) {
  currentScore = score;
  if (game.game_over() || game.in_draw()) {
    $('#advantageBarBlack, #advantageBarBlackRight').css('height', '50%');
    $('#advantageBarWhite, #advantageBarWhiteRight').css('height', '50%');
    $('#scoreText, #scoreTextRight').text('Patta');
    return;
  }
  var winProb = 1 / (1 + Math.exp(-0.0035 * score));
  var whiteHeight = winProb * 100;
  $('#advantageBarWhite, #advantageBarWhiteRight').css('height', whiteHeight + '%');
  $('#advantageBarBlack, #advantageBarBlackRight').css('height', (100 - whiteHeight) + '%');
  $('#scoreText, #scoreTextRight').text(score + ' cp (' + Math.round(winProb * 100) + '% ♔)');
}

function updateGameResult() {
  if (game.in_checkmate()) {
    var winner = game.turn() === 'w' ? 'Nero' : 'Bianco';
    $('#gameResult, #gameResultRight').text('Scaccomatto! ' + winner + ' vince')
      .removeClass().addClass('text-danger fw-bold');
  } else if (game.in_draw()) {
    $('#gameResult, #gameResultRight').text('Patta')
      .removeClass().addClass('text-muted fw-bold');
    updateAdvantageBar(0);
  } else {
    $('#gameResult, #gameResultRight').text('');
  }
}

function recordMove(san) {
  // Se eravamo indietro nel replay, tronca la storia da qui
  if (viewIndex < moveHistory.length) {
    moveHistory = moveHistory.slice(0, viewIndex);
    fenHistory = fenHistory.slice(0, viewIndex + 1);
  }
  moveHistory.push(san);
  fenHistory.push(game.fen());
  viewIndex = moveHistory.length;
  isReplaying = false;
  updateMoveList();
}

function updateMoveList() {
  var html = '';
  for (var i = 0; i < moveHistory.length; i++) {
    var moveNum = Math.floor(i / 2) + 1;
    var isWhite = (i % 2 === 0);
    if (isWhite) html += '<span class="move-num">' + moveNum + '.</span> ';
    var activeClass = (i + 1 === viewIndex) ? ' move-active' : '';
    html += '<span class="move-san' + activeClass + '" data-idx="' + (i + 1) + '">' + moveHistory[i] + '</span> ';
  }
  $('#moveList').html(html);
  $('#moveCounter').text(viewIndex + ' / ' + moveHistory.length);
  // Auto-scroll in fondo
  var el = document.getElementById('moveList');
  if (el) el.scrollTop = el.scrollHeight;
}

function goToMove(idx) {
  if (idx < 0) idx = 0;
  if (idx > moveHistory.length) idx = moveHistory.length;
  viewIndex = idx;
  isReplaying = (idx < moveHistory.length);

  // Carica il FEN corrispondente
  var fen = fenHistory[idx];
  board.position(fen);
  removeAllHighlights();
  updateMoveList();

  // Se siamo all'ultima mossa, sincronizza game con la posizione reale
  if (!isReplaying) {
    game.load(fen);
  }
}

// ── STOCKFISH ──

function initStockfish() {
  updateStatus('Caricamento Stockfish...', 'info');
  var stockfishUrl = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
  fetch(stockfishUrl)
    .then(function(r) {
      if (!r.ok) throw new Error('Fetch fallito: ' + r.status);
      return r.text();
    })
    .then(function(script) {
      var blob = new Blob([script], {type: 'application/javascript'});
      var url = URL.createObjectURL(blob);
      stockfish = new Worker(url);
      stockfish.onmessage = function(e) {
        var line = e.data.trim();
        console.log('Stockfish:', line);
        if (line.includes('uciok') || line.includes('readyok')) {
          stockfishReady = true;
          updateStatus('Stockfish pronto!', 'success');
        }
        if (line.includes('score cp')) {
          var match = line.match(/score cp (\-?\d+)/);
          if (match) {
            var score = parseInt(match[1]);
            if (game.turn() === 'b') score = -score;
            updateAdvantageBar(score);
          }
        }
        if (line.startsWith('bestmove')) {
          var match = line.match(/bestmove\s+(\S+)/);
          if (match) {
            var uci = match[1];
            var move = game.move(uci, {sloppy: true});
            if (move) {
              recordMove(move.san);
              board.position(game.fen());
              updateGameResult();
              removeAllHighlights();
              var hlClass = move.color === 'w' ? 'highlight-white' : 'highlight-black';
              $('#myBoard .square-' + move.from).addClass(hlClass);
              $('#myBoard .square-' + move.to).addClass(hlClass);
              highlightThreatsAndUnprotected();
              updateStatus('Computer ha mosso: ' + move.san, 'success');
              if (move.captured) {
                if (move.color === 'w') blackCaptured.push(move.captured);
                else whiteCaptured.push(move.captured);
                updateCapturedPieces();
              }
              if (game.game_over()) {
                updateStatus(game.in_checkmate() ? 'Scaccomatto!' : 'Partita finita.', 'danger');
              } else if (computerPlaysWhite && computerPlaysBlack && !isPaused) {
                timeoutId = setTimeout(makeComputerMove, 800);
              }
            }
          }
        }
      };
      stockfish.onerror = function(err) { console.error('Worker error:', err); };
      stockfish.postMessage('uci');
      stockfish.postMessage('isready');
    })
    .catch(function(err) { updateStatus('Errore caricamento Stockfish', 'danger'); });
}

function onDragStart(source, piece) {
  if (isReplaying) return false;
  if (game.game_over()) return false;
  var turn = game.turn();
  if ((turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack)) return false;
  if (computerPlaysWhite && computerPlaysBlack) return false;
  if ((turn === 'w' && piece.search(/^b/) !== -1) || (turn === 'b' && piece.search(/^w/) !== -1)) return false;
  return true;
}

function onDrop(source, target) {
  var move = game.move({from: source, to: target, promotion: 'q'});
  if (move === null) return 'snapback';
  recordMove(move.san);
  removeAllHighlights();
  var hlClass = move.color === 'w' ? 'highlight-white' : 'highlight-black';
  $('#myBoard .square-' + source).addClass(hlClass);
  $('#myBoard .square-' + target).addClass(hlClass);
  board.position(game.fen());
  highlightThreatsAndUnprotected();
  updateStatus('Tocca al computer...', 'info');
  if (move.captured) {
    if (move.color === 'w') blackCaptured.push(move.captured);
    else whiteCaptured.push(move.captured);
    updateCapturedPieces();
  }
  updateGameResult();
  timeoutId = setTimeout(makeComputerMove, 600);
}

function onSquareTap(square) {
  if (isReplaying) return;
  var piece = game.get(square);
  var turn = game.turn();
  if (selectedSquare) {
    if (selectedSquare === square) {
      selectedSquare = null;
      removeAllHighlights();
      highlightThreatsAndUnprotected();
      return;
    }
    var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
    if (move !== null) {
      recordMove(move.san);
      selectedSquare = null;
      removeAllHighlights();
      var hlClass = move.color === 'w' ? 'highlight-white' : 'highlight-black';
      $('#myBoard .square-' + move.from).addClass(hlClass);
      $('#myBoard .square-' + move.to).addClass(hlClass);
      board.position(game.fen());
      highlightThreatsAndUnprotected();
      updateGameResult();
      if (move.captured) {
        if (move.color === 'w') blackCaptured.push(move.captured);
        else whiteCaptured.push(move.captured);
        updateCapturedPieces();
      }
      updateStatus('Tocca al computer...', 'info');
      timeoutId = setTimeout(makeComputerMove, 600);
      return;
    }
    if (piece && piece.color === humanColor) {
      selectedSquare = square;
      highlightSelectedAndMoves(square);
      return;
    }
    selectedSquare = null;
    removeAllHighlights();
    highlightThreatsAndUnprotected();
    return;
  }
  if (!piece || piece.color !== humanColor) return;
  if ((turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack)) return;
  if (game.game_over()) return;
  selectedSquare = square;
  highlightSelectedAndMoves(square);
}

function highlightSelectedAndMoves(square) {
  removeAllHighlights();
  $('#myBoard .square-' + square).addClass('highlight-selected');
  var moves = game.moves({ square: square, verbose: true });
  moves.forEach(function(m) {
    $('#myBoard .square-' + m.to).addClass('highlight-legal');
  });
}

function makeComputerMove() {
  var turn = game.turn();
  if (game.game_over() || isPaused || isReplaying) return;
  if (!((turn === 'w' && computerPlaysWhite) || (turn === 'b' && computerPlaysBlack))) return;
  if (!stockfishReady) {
    timeoutId = setTimeout(makeComputerMove, 1200);
    return;
  }
  updateStatus('Stockfish sta pensando...', 'warning');
  var depth, skill;
  if ((turn === 'w' && computerPlaysWhite) || (turn === 'b' && !computerPlaysWhite)) {
    depth = strengthLevel;
    skill = skillLevel;
  } else {
    depth = strengthLevelBlack;
    skill = skillLevelBlack;
  }
  if (depth == 0) {
    var moves = game.moves({verbose: true});
    if (moves.length > 0) {
      var randomMove = moves[Math.floor(Math.random() * moves.length)];
      game.move(randomMove);
      recordMove(randomMove.san || randomMove);
      board.position(game.fen());
      removeAllHighlights();
      $('#myBoard .square-' + randomMove.from).addClass('highlight-black');
      $('#myBoard .square-' + randomMove.to).addClass('highlight-black');
      updateStatus('Mossa random (depth 0)', 'warning');
      if (computerPlaysWhite && computerPlaysBlack && !isPaused) {
        timeoutId = setTimeout(makeComputerMove, 400);
      }
      return;
    }
  }
  stockfish.postMessage('position fen ' + game.fen());
  stockfish.postMessage('setoption name Skill Level value ' + skill);
  stockfish.postMessage('go depth ' + depth);
}

function resetGame() {
  game.reset();
  board.position('start');
  isPaused = true;
  isReplaying = false;
  moveHistory = [];
  fenHistory = [game.fen()];
  viewIndex = 0;
  startFen = 'startpos';
  updateMoveList();
  $('#pauseRestartButton').removeClass('d-none').text('Start');
  removeAllHighlights();
  whiteCaptured = [];
  blackCaptured = [];
  updateCapturedPieces();
  updateAdvantageBar(0);
  updateStatus('Nuova partita!', 'success');
  humanColor = computerPlaysWhite ? 'b' : 'w';
  if (stockfishReady && (computerPlaysWhite || computerPlaysBlack)) {
    stockfish.postMessage('ucinewgame');
  }
  updateGameResult();
}

function initBoard() {
  board = Chessboard('myBoard', {
    draggable: !isMobile,
    position: 'start',
    pieceTheme: currentPieceTheme,
    showNotation: true,
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: function() { board.position(game.fen()); },
    orientation: boardOrientation
  });
  if (isMobile) {
    $('#myBoard').on('click', '.square-55d63', function() {
      if (isPaused || game.game_over()) return;
      var classes = $(this).attr('class') || '';
      var match = classes.match(/square-([a-h][1-8])/);
      if (match) onSquareTap(match[1]);
    });
  }
}

function handleModeChange(mode) {
  computerPlaysWhite = mode === 'white' || mode === 'both';
  computerPlaysBlack = mode === 'black' || mode === 'both';
  boardOrientation = mode === 'white' ? 'black' : 'white';
  humanColor = computerPlaysWhite ? 'b' : 'w';
  if (board) board.orientation(boardOrientation);
}

// ── SAVE / LOAD / DELETE ──

function getGameResult() {
  if (game.in_checkmate()) {
    return game.turn() === 'w' ? '0-1' : '1-0';
  }
  if (game.in_draw()) return '1/2-1/2';
  return '*';
}

function saveCurrentGame() {
  var name = prompt('Nome della partita:', 'Partita ' + new Date().toLocaleString('it'));
  if (!name) return;

  var pgn = game.pgn();
  var result = getGameResult();

  updateStatus('Salvataggio...', 'warning');
  google.script.run
    .withSuccessHandler(function(res) {
      updateStatus(res.message, 'success');
    })
    .withFailureHandler(function(err) {
      updateStatus('Errore: ' + err.message, 'danger');
    })
    .saveGame(name, pgn, result, startFen);
}

function loadGameList() {
  var container = $('#gameListContainer');
  container.toggleClass('d-none');
  if (container.hasClass('d-none')) return;

  $('#gameListSpinner').removeClass('d-none');
  $('#gameList').empty();

  google.script.run
    .withSuccessHandler(function(games) {
      $('#gameListSpinner').addClass('d-none');
      if (!games || games.length === 0) {
        $('#gameList').html('<div class="text-muted small">Nessuna partita salvata.</div>');
        return;
      }
      var html = '';
      games.forEach(function(g) {
        html += '<div class="game-item" data-id="' + g.id + '">';
        html += '<div class="game-item-info">';
        html += '<strong class="small">' + g.name + '</strong>';
        html += '<span class="text-muted" style="font-size:10px">' + g.date + ' · ' + g.result + '</span>';
        html += '</div>';
        html += '<div class="game-item-actions">';
        html += '<button class="btn btn-sm btn-outline-primary load-game-btn" title="Carica">▶</button>';
        html += '<button class="btn btn-sm btn-outline-danger delete-game-btn" title="Elimina">✕</button>';
        html += '</div>';
        html += '</div>';
      });
      $('#gameList').html(html);
    })
    .withFailureHandler(function(err) {
      $('#gameListSpinner').addClass('d-none');
      $('#gameList').html('<div class="text-danger small">Errore: ' + err.message + '</div>');
    })
    .listGames();
}

function loadGameById(id) {
  updateStatus('Caricamento partita...', 'warning');
  google.script.run
    .withSuccessHandler(function(g) {
      if (!g) {
        updateStatus('Partita non trovata.', 'danger');
        return;
      }

      // Reset
      game = new Chess();
      if (g.startFen && g.startFen !== 'startpos') {
        game.load(g.startFen);
      }
      startFen = g.startFen || 'startpos';

      // Carica PGN
      if (g.pgn) {
        game.load_pgn(g.pgn);
      }

      // Ricostruisci la storia mosse/FEN
      var tempGame = new Chess();
      if (g.startFen && g.startFen !== 'startpos') {
        tempGame.load(g.startFen);
      }
      fenHistory = [tempGame.fen()];
      moveHistory = [];

      var history = game.history();
      history.forEach(function(san) {
        tempGame.move(san);
        moveHistory.push(san);
        fenHistory.push(tempGame.fen());
      });

      viewIndex = moveHistory.length;
      isReplaying = false;
      isPaused = true;

      board.position(game.fen());
      board.orientation(boardOrientation);

      whiteCaptured = [];
      blackCaptured = [];
      updateCapturedPieces();
      updateAdvantageBar(0);
      updateMoveList();
      updateGameResult();
      $('#pauseRestartButton').text('Start');
      updateStatus('Partita caricata: ' + g.name, 'success');
      $('#gameListContainer').addClass('d-none');
    })
    .withFailureHandler(function(err) {
      updateStatus('Errore: ' + err.message, 'danger');
    })
    .loadGame(id);
}

function deleteGameById(id) {
  if (!confirm('Eliminare questa partita?')) return;
  google.script.run
    .withSuccessHandler(function(res) {
      updateStatus(res.message, res.success ? 'success' : 'danger');
      if (res.success) loadGameList(); // Ricarica lista
    })
    .withFailureHandler(function(err) {
      updateStatus('Errore: ' + err.message, 'danger');
    })
    .deleteGame(id);
}

// ── INIT ──

$(document).ready(function() {
  updateStatus('Inizializzazione...', 'info');
  initStockfish();
  initBoard();
  fenHistory = [game.fen()];
  updateMoveList();

  $('#boardThemeSelect').on('change', function() { applyBoardTheme($(this).val()); });
  applyBoardTheme('classic');

  $('#pieceThemeSelect').on('change', function() {
    currentPieceTheme = pieceThemes[$(this).val()] || pieceThemes['cburnett'];
    board = Chessboard('myBoard', {
      draggable: true,
      position: game.fen(),
      pieceTheme: currentPieceTheme,
      showNotation: true,
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: function() { board.position(game.fen()); },
      orientation: boardOrientation
    });
    highlightThreatsAndUnprotected();
    updateCapturedPieces();
  });

  $('#setupButton').click(function() {
    isSetupMode = true;
    $('#myBoard').addClass('d-none');
    $('#setupContainer').removeClass('d-none');
    updateStatus('Modalità setup – trascina i pezzi', 'warning');
    setTimeout(function() {
      setupBoard = Chessboard('setupBoard', {
        draggable: true,
        dropOffBoard: 'trash',
        sparePieces: true,
        position: game.fen(),
        pieceTheme: currentPieceTheme,
        onDrop: function() { return true; }
      });
      setupBoard.resize();
    }, 50);
  });

  $('#applySetup').click(function() {
    var positionObj = setupBoard.position();
    game.clear();
    for (var square in positionObj) {
      if (positionObj.hasOwnProperty(square)) {
        var pieceStr = positionObj[square];
        if (pieceStr && pieceStr.length === 2) {
          game.put({type: pieceStr[1].toLowerCase(), color: pieceStr[0]}, square);
        }
      }
    }
    var newFen = game.fen();
    game.load(newFen);
    startFen = newFen;
    fenHistory = [newFen];
    moveHistory = [];
    viewIndex = 0;
    updateMoveList();
    board.position(newFen);
    board.orientation(boardOrientation);
    $('#setupContainer').addClass('d-none');
    $('#myBoard').removeClass('d-none');
    isSetupMode = false;
    updateStatus('Posizione applicata!', 'success');
    setupBoard.destroy();
    setupBoard = null;
    timeoutId = setTimeout(makeComputerMove, 400);
  });

  $('#cancelSetup').click(function() {
    $('#setupContainer').addClass('d-none');
    $('#myBoard').removeClass('d-none');
    isSetupMode = false;
    updateStatus('Setup annullato.', 'warning');
    setupBoard.destroy();
    setupBoard = null;
  });

  $('#playerMode').change(function() {
    var mode = $(this).val();
    handleModeChange(mode);
    isPaused = true;
    $('#pauseRestartButton').removeClass('d-none').text('Start');
    if (mode === 'both') {
      $('#secondStrengthContainer').removeClass('d-none');
    } else {
      $('#secondStrengthContainer').addClass('d-none');
    }
  });

  $('#pauseRestartButton').click(function() {
    // Se in replay, torna alla fine prima
    if (isReplaying) {
      goToMove(moveHistory.length);
      game.load(fenHistory[moveHistory.length]);
    }
    if (isPaused) {
      isPaused = false;
      $('#pauseRestartButton').text('Pause');
      updateStatus('Partita ripresa!', 'success');
      timeoutId = setTimeout(makeComputerMove, 400);
    } else {
      isPaused = true;
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
      updateStatus('Partita in pausa.', 'warning');
      $('#pauseRestartButton').text('Start');
    }
  });

  $('#strengthSlider').on('input', function() {
    strengthLevel = parseInt($(this).val());
    $('#strengthValue').text(strengthLevel);
  });
  $('#strengthSliderBlack').on('input', function() {
    strengthLevelBlack = parseInt($(this).val());
    $('#strengthValueBlack').text(strengthLevelBlack);
  });
  $('#skillSlider').on('input', function() {
    skillLevel = parseInt($(this).val());
    $('#skillValue').text(skillLevel);
  });
  $('#skillSliderBlack').on('input', function() {
    skillLevelBlack = parseInt($(this).val());
    $('#skillValueBlack').text(skillLevelBlack);
  });
  $('#seedInput').on('input', function() {
    currentSeed = parseInt($(this).val()) || 0;
  });
  $('#randomSeedButton').click(function() {
    currentSeed = Math.floor(Math.random() * 100000) + 1;
    $('#seedInput').val(currentSeed);
  });
  $('#resetButton').click(function() {
    handleModeChange($('#playerMode').val());
    resetGame();
  });

  // ── NAVIGATORE MOSSE ──
  $('#moveFirst').click(function() { goToMove(0); });
  $('#movePrev').click(function()  { goToMove(viewIndex - 1); });
  $('#moveNext').click(function()  { goToMove(viewIndex + 1); });
  $('#moveLast').click(function()  { goToMove(moveHistory.length); });

  // Click su singola mossa nella lista
  $('#moveList').on('click', '.move-san', function() {
    var idx = parseInt($(this).data('idx'));
    goToMove(idx);
  });

  // ── SAVE / LOAD ──
  $('#saveGameBtn').click(saveCurrentGame);
  $('#loadListBtn').click(loadGameList);

  // Deleghe click per carica / elimina
  $('#gameList').on('click', '.load-game-btn', function() {
    var id = $(this).closest('.game-item').data('id');
    loadGameById(id);
  });
  $('#gameList').on('click', '.delete-game-btn', function() {
    var id = $(this).closest('.game-item').data('id');
    deleteGameById(id);
  });

  handleModeChange('black');
});
</script>
